name: Azure Scout

# Runs a real, headless Azure Scout inventory using a service-principal
# (client-secret) login and uploads the React/JSON reports as build artifacts.
#
# This workflow consumes the repository's own composite action (./), so it
# exercises the same code path external consumers get from
# `uses: Hybrid-Solutions-Cloud/azure-scout@v2`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_TENANT_ID        - Entra tenant (directory) ID
#   AZURE_CLIENT_ID        - App registration (service principal) client ID
#   AZURE_CLIENT_SECRET    - Client secret for that service principal
#   AZURE_SUBSCRIPTION_ID  - Subscription to inventory (optional; omit to scan all
#                            subscriptions the SPN can read)
#
# The service principal needs at least Reader on the target scope. No secret is
# ever echoed; -Secret is passed straight into the module's non-interactive login.

on:
  workflow_dispatch:
    inputs:
      subscriptionId:
        description: 'Subscription ID to inventory (blank = all readable subscriptions)'
        required: false
        default: ''
      category:
        description: 'Comma-separated category filter (blank = all categories)'
        required: false
        default: ''
      scope:
        description: 'Data sources to query'
        required: false
        default: 'ArmOnly'
        type: choice
        options:
          - ArmOnly
          - EntraOnly
          - All
      reportName:
        description: 'Report name prefix'
        required: false
        default: 'AzureScout'
      outputFormat:
        description: 'Live report output'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - React
          - Json
          - JsonEvidence
  # Uncomment to run on a schedule (first of every month, 06:00 UTC):
  # schedule:
  #   - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  run-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Azure credentials are configured
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          missing=0
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret $v is not set. See the header of this workflow for setup."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Azure service-principal credentials present."

      - name: Run Azure Scout inventory
        uses: ./
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ github.event.inputs.subscriptionId || secrets.AZURE_SUBSCRIPTION_ID }}
          category: ${{ github.event.inputs.category }}
          scope: ${{ github.event.inputs.scope }}
          report-name: ${{ github.event.inputs.reportName }}
          output-format: ${{ github.event.inputs.outputFormat || 'All' }}
          artifact-name: azure-scout-reports
