name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/documentation.yml'
      # Version-bearing files. The docs site states the current release, so a release commit that
      # touches only the manifest/changelog must still redeploy it. Without these, a release that
      # forgot a docs/ edit shipped a silently stale site -- which is exactly how the published
      # changelog page ended up two minor releases behind. (AB#5630)
      - 'AzureScout.psd1'
      - 'CHANGELOG.md'
      - 'RELEASES.md'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/documentation.yml'
      # Version-bearing files. The docs site states the current release, so a release commit that
      # touches only the manifest/changelog must still redeploy it. Without these, a release that
      # forgot a docs/ edit shipped a silently stale site -- which is exactly how the published
      # changelog page ended up two minor releases behind. (AB#5630)
      - 'AzureScout.psd1'
      - 'CHANGELOG.md'
      - 'RELEASES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, hcs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/.vitepress/dist
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, x64, hcs]
    permissions:
      contents: write
    steps:
      - name: Download built documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: docs/.vitepress/dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
