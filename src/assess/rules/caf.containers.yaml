area: "Containers security & reliability"
framework: CAF
frameworkversion: "CAF design-area guidance, learn.microsoft.com/azure/cloud-adoption-framework, verified 2026-07-31 (docs/audits/AZURE-SCOUT-AUDIT.md, section 8)"
weight: 1.0
# AB#6798: service-guide file, not a CAF design area -- see caf.ai.yaml header for the pattern.
kind: service-guide
designAreaRef: "Security"
verifiedAgainst: "CAF landing zone design area: Security, learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/design-area/security, verified 2026-08-01"
rules:
  - id: CAF-CON-01
    title: "AKS clusters are private or API-access restricted"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.privateCluster == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Enable private cluster or authorized IP ranges on the AKS API server."
    manual: false
  - id: CAF-CON-02
    title: "AKS clusters have RBAC enabled"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.rbacEnabled == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Enable Kubernetes RBAC (and Entra integration) on all clusters."
    manual: false
  - id: CAF-CON-03
    title: "Container registries disable the admin user"
    severity: medium
    query: "$.domains.containers.containerRegistries[?(@.adminEnabled == true)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Disable the ACR admin user; use Entra identities / tokens."
    manual: false
  - id: CAF-CON-04
    title: "Container registries restrict public network access"
    severity: high
    query: "$.domains.containers.containerRegistries[?(@.publicAccess == 'Enabled')]"
    assert: { type: countEquals, value: 0 }
    remediation: "Set publicNetworkAccess to Disabled on ACR and use private endpoints for image pull/push."
    manual: false
  - id: CAF-CON-05
    title: "AKS node pools spread across availability zones"
    severity: medium
    # Invoke-Collect.ps1 now mv-expands agentPoolProfiles and summarizes back to
    # one row per cluster, projecting allPoolsZoned (AB#5057).
    query: "$.domains.containers.aksClusters[?(@.allPoolsZoned == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Configure agent pools with zones [1,2,3] for production clusters."
    manual: false
  - id: CAF-CON-06
    title: "AKS clusters enforce a network policy"
    severity: medium
    # properties.networkProfile.networkPolicy is now projected as
    # networkPolicyEnabled (AB#5057).
    query: "$.domains.containers.aksClusters[?(@.networkPolicyEnabled == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Enable a network policy engine (Azure or Calico) to restrict pod-to-pod traffic."
    manual: false
  # AB#9300, depth wiring. Registry image scanning is a Defender for Containers capability, billed and switched on per
  # SUBSCRIPTION, so the question is whether the subscription each registry sits in has the Containers plan on the
  # Standard tier. A registry is listed when there is no such plan row for its subscription. Gated on both datasets:
  # no registry, or no Defender plan read at all (the plan sweep failed), is Not assessed rather than a Fail. Whether the
  # plan's registry vulnerability assessment extension is on, and which images were scanned, are not read.
  - id: CAF-CON-07
    title: "CAF-CON-07. Container registries enable vulnerability scanning"
    severity: high
    join:
      left: "$.domains.containers.containerRegistries[*]"
      leftKey: "subscriptionId"
      right: "$.security.defenderPlans[?(@.name == 'Containers' && @.properties.pricingTier == 'Standard')]"
      rightKey: "subscriptionId"
      mode: leftOnly
      leftLabel: "container registry"
      rightLabel: "Defender for Containers plan"
    assert:
      type: countEquals
      value: 0
      gate:
        - "$.domains.containers.containerRegistries[*]"
        - "$.security.defenderPlans[*]"
    remediation: "CAF-CON-07. The registries listed sit in subscriptions where Microsoft Defender for Containers is not on the Standard tier, so their images are not scanned for vulnerabilities. Enable the Containers plan on the subscription (its registry vulnerability assessment extension scans images on push, pull and continuously). Whether that extension is switched on within the plan, and which images were scanned, are not read: confirm them in Defender for Cloud's registry coverage, or use content trust for signed images."
    manual: false
  - id: CAF-CON-08
    title: "AKS clusters use Entra ID integrated authentication"
    severity: high
    # properties.aadProfile is now projected as aadIntegrated (AB#5057).
    query: "$.domains.containers.aksClusters[?(@.aadIntegrated == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Enable AKS-managed Entra ID integration (aadProfile) rather than local Kubernetes accounts."
    manual: false
