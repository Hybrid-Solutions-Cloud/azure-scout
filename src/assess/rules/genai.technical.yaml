# genai.technical.yaml -- Technical Assessment for Generative AI in Azure (AB#9300)
#
# Scout's rule set for Microsoft's "Technical Assessment for Generative AI in Azure"
# (learn.microsoft.com/assessments/443670b4-11d1-4dd7-8128-b2bdb7a2bf2f): readiness of a team to
# develop, run and maintain generative AI solutions on Azure in production.
#
# Written ONLY against docs/frameworks/genai-technical-question-set.md. Microsoft does not publish the
# assessment's question text, so every item is SCOUT-DERIVED: Scout's reading of the Well-Architected
# AI workload guidance (operations, MLOps and GenAIOps, responsible AI, testing, grounding data), the
# Microsoft Foundry architecture and baseline chat reference architecture, and the CAF AI platform
# governance and security pages. The GENAI-* ids are Scout's own.
#
# It overlaps deliberately with waf.ai.yaml (the Well-Architected AI workload review). That review
# scores a workload against design areas; this one asks whether the team and platform are ready to
# put a generative AI solution into production. Some automated checks read the same properties and
# are scored under both frameworks; the ids differ.
#
# Most items are organisational or architectural, so most rules are `manual: true` and are answered
# with -AssessmentAnswers. Automated rules score only properties that exist in collect.json, and each
# is gated on the AI resources it judges: an estate without them reports Not assessed.
area: "Generative AI technical readiness"
framework: GENAI-TECH
frameworkversion: "Microsoft Technical Assessment for Generative AI in Azure (questions unpublished) + WAF AI workload guidance and Microsoft Foundry guidance, docs/frameworks/genai-technical-question-set.md, verified 2026-11-25 (Scout-derived items across eight readiness areas)"
weight: 1.0
verifiedAgainst: "docs/frameworks/genai-technical-question-set.md (Scout enumeration of learn.microsoft.com/azure/well-architected/ai/*, azure/foundry/* and the Foundry baseline architecture), verified 2026-11-25"
rules:
  # ---- Team skills and delivery (TS) -- 5 items --------------------
  - id: GENAI-TS-01
    title: "GENAI-TS-01. The team has the skills to build and run generative AI solutions"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-TS-01. Organisational -- confirm the team covers prompt engineering, retrieval-augmented generation, evaluation, orchestration and AI operations, with a plan to close gaps."
    manual: true
  - id: GENAI-TS-02
    title: "GENAI-TS-02. Use cases are validated with a proof of value before production build"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-TS-02. Organisational -- confirm each use case was tested against success criteria and a baseline before committing to a production build."
    manual: true
  - id: GENAI-TS-03
    title: "GENAI-TS-03. The team understands model quotas, limits and regional availability"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-TS-03. Organisational -- confirm quota, rate limits, deployment types and regional model availability were checked against the planned load before design was fixed."
    manual: true
  - id: GENAI-TS-04
    title: "GENAI-TS-04. Data scientists review experiments with prompts and retrieval"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-TS-04. Organisational -- confirm experiment design and evaluation of prompt and retrieval changes is reviewed by someone trained to evaluate results scientifically."
    manual: true
  - id: GENAI-TS-05
    title: "GENAI-TS-05. Runbooks exist for routine, unplanned and emergency AI operations"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-TS-05. Organisational -- confirm documented procedures cover model changes, index rebuilds, quota increases and incident response for AI components."
    manual: true

  # ---- Solution design (SD) -- 8 items --------------------
  - id: GENAI-SD-01
    title: "GENAI-SD-01. Models are selected by evaluating candidates against requirements"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-SD-01. Organisational -- confirm models were compared from a catalogue on quality, latency, cost and risk for the use case, and the choice recorded."
    manual: true
  - id: GENAI-SD-02
    title: "GENAI-SD-02. The technical pattern (prompting, retrieval-augmented generation or fine-tuning) is chosen with a rationale"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-SD-02. Organisational -- confirm the pattern was chosen deliberately, with fine-tuning used only where prompting and retrieval cannot meet the need."
    manual: true
  - id: GENAI-SD-03
    title: "GENAI-SD-03. The orchestration layer is separated from the model and the data stores"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-SD-03. Organisational -- confirm the orchestrator (the code or agent service that builds prompts and calls models and tools) is a distinct, versioned and testable component."
    manual: true
  - id: GENAI-SD-04
    title: "GENAI-SD-04. Agent tools and permissions are scoped to each agent's task"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-SD-04. Organisational -- confirm each agent can call only approved tools, with its own identity and human approval for higher-risk actions."
    manual: true
  - id: GENAI-SD-05
    title: "GENAI-SD-05. A gateway sits in front of model endpoints"
    severity: medium
    query: "$.domains.integration.apiManagement[*]"
    assert: { type: manual }
    remediation: "GENAI-SD-05. Organisational -- confirm a gateway such as Azure API Management handles authentication, load balancing, monitoring and progressive rollout of models (API Management instances are attached as evidence)."
    manual: true
  - id: GENAI-SD-06
    title: "GENAI-SD-06. Related AI resources are deployed in the same region"
    severity: low
    query: "$.domains.ai.cognitiveAccounts[*]"
    assert: { type: manual }
    remediation: "GENAI-SD-06. Organisational -- confirm models, search indexes and orchestration share a region unless residency or capacity dictates otherwise (Azure AI accounts are attached as evidence)."
    manual: true
  - id: GENAI-SD-07
    title: "GENAI-SD-07. Managed platforms are preferred over custom hosting"
    severity: medium
    query: "$.domains.ai.mlWorkspaces[*]"
    assert: { type: manual }
    remediation: "GENAI-SD-07. Organisational -- confirm custom model hosting is the exception, with a reason it could not use a managed service (machine learning workspaces are attached as evidence)."
    manual: true
  - id: GENAI-SD-08
    title: "GENAI-SD-08. The model deployment type matches residency and throughput needs"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-SD-08. Organisational -- confirm global, data zone or regional deployments, and standard or provisioned capacity, were chosen against data residency and throughput requirements."
    manual: true

  # ---- Grounding data and search (DG) -- 6 items --------------------
  - id: GENAI-DG-01
    title: "GENAI-DG-01. Grounding data sources are selected and prepared deliberately"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-DG-01. Organisational -- confirm sources, chunking, enrichment and embedding choices were experimented with and evaluated, not defaulted."
    manual: true
  - id: GENAI-DG-02
    title: "GENAI-DG-02. Search indexes are kept fresh and can be rebuilt"
    severity: medium
    query: "$.domains.ai.searchServices[*]"
    assert: { type: manual }
    remediation: "GENAI-DG-02. Organisational -- confirm index updates meet freshness, performance and right-to-be-forgotten requirements, and an index can be rebuilt (AI Search services are attached as evidence)."
    manual: true
  - id: GENAI-DG-03
    title: "GENAI-DG-03. AI Search services are not on the free tier and have at least two replicas"
    severity: high
    query: "$.domains.ai.searchServices[?(@.sku == 'free' || @.replicaCount < 2)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.searchServices[*]" }
    remediation: "GENAI-DG-03. The AI Search services listed use the free tier or have fewer than two replicas, so a single failure or maintenance event removes search. Move to a paid tier with at least two replicas for production."
    manual: false
  - id: GENAI-DG-04
    title: "GENAI-DG-04. AI Search services do not accept API keys"
    severity: high
    query: "$.domains.ai.searchServices[?(@.disableLocalAuth != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.searchServices[*]" }
    remediation: "GENAI-DG-04. The AI Search services listed still accept API keys. Set disableLocalAuth to true and use Microsoft Entra ID with role-based access."
    manual: false
  - id: GENAI-DG-05
    title: "GENAI-DG-05. AI Search services have public network access disabled"
    severity: high
    query: "$.domains.ai.searchServices[?(@.publicAccess == 'enabled' || @.publicAccess == 'Enabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.searchServices[*]" }
    remediation: "GENAI-DG-05. The AI Search services listed allow public network access. Disable it and use private endpoints."
    manual: false
  - id: GENAI-DG-06
    title: "GENAI-DG-06. Retrieval respects each user's access to the underlying data"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-DG-06. Organisational -- confirm search results are security-trimmed so a user cannot retrieve content they are not allowed to read."
    manual: true

  # ---- Security and identity (SE) -- 10 items --------------------
  - id: GENAI-SE-01
    title: "GENAI-SE-01. Azure AI accounts do not accept API keys"
    severity: high
    query: "$.domains.ai.cognitiveAccounts[?(@.disableLocalAuth != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.cognitiveAccounts[*]" }
    remediation: "GENAI-SE-01. The Azure AI accounts listed still accept API keys. Set disableLocalAuth to true and use Microsoft Entra ID with role-based access."
    manual: false
  - id: GENAI-SE-02
    title: "GENAI-SE-02. Azure AI accounts have a managed identity"
    severity: high
    query: "$.domains.ai.cognitiveAccounts[?(@.identityType == '' || @.identityType == 'None')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.cognitiveAccounts[*]" }
    remediation: "GENAI-SE-02. The Azure AI accounts listed have no managed identity. Assign one so the service reaches data and other resources without stored credentials."
    manual: false
  - id: GENAI-SE-03
    title: "GENAI-SE-03. Azure AI accounts have public network access disabled"
    severity: high
    query: "$.domains.ai.cognitiveAccounts[?(@.publicAccess == 'Enabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.cognitiveAccounts[*]" }
    remediation: "GENAI-SE-03. The Azure AI accounts listed allow public network access. Disable it and reach the service through private endpoints."
    manual: false
  - id: GENAI-SE-04
    title: "GENAI-SE-04. Azure AI accounts have a private endpoint"
    severity: high
    join:
      left: "$.domains.ai.cognitiveAccounts[*]"
      leftKey: "id"
      right: "$.networking.privateEndpoints[*]"
      rightKey: "targetResourceId"
      mode: leftOnly
      leftLabel: "Azure AI account"
      rightLabel: "private endpoint"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.cognitiveAccounts[*]" }
    remediation: "GENAI-SE-04. The Azure AI accounts listed have no private endpoint. Add one so model and data traffic stays on the private network."
    manual: false
  - id: GENAI-SE-05
    title: "GENAI-SE-05. Machine learning workspaces have public network access disabled"
    severity: high
    query: "$.domains.ai.mlWorkspaces[?(@.publicAccess == 'Enabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.mlWorkspaces[*]" }
    remediation: "GENAI-SE-05. The machine learning workspaces listed allow public network access. Disable it and use private endpoints or a managed virtual network."
    manual: false
  - id: GENAI-SE-06
    title: "GENAI-SE-06. Machine learning workspaces use managed network isolation"
    severity: medium
    query: "$.domains.ai.mlWorkspaces[?(@.isolationMode != 'AllowOnlyApprovedOutbound' && @.isolationMode != 'AllowInternetOutbound')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.mlWorkspaces[*]" }
    remediation: "GENAI-SE-06. The machine learning workspaces listed have no managed network isolation. Set an outbound mode (approved-only is the strictest) so training and inference traffic is controlled."
    manual: false
  - id: GENAI-SE-07
    title: "GENAI-SE-07. Defender for Cloud threat protection for AI services is enabled"
    severity: high
    query: "$.security.defenderPlans[?(@.name == 'AI' && @.properties.pricingTier == 'Standard')]"
    assert: { type: exists, gate: "$.domains.ai.cognitiveAccounts[*]" }
    remediation: "GENAI-SE-07. No subscription has the Defender for AI services plan on the Standard tier. Enable it to detect prompt injection, data leakage and wallet abuse (checked across the estate, not per subscription)."
    manual: false
  - id: GENAI-SE-08
    title: "GENAI-SE-08. Customer-managed keys protect data where policy requires them"
    severity: medium
    query: "$.domains.ai.cognitiveAccounts[?(@.cmkEnabled == false)]"
    assert: { type: manual }
    remediation: "GENAI-SE-08. Organisational -- confirm which AI resources need customer-managed keys, and that they use them (Azure AI accounts without customer-managed keys are attached as evidence)."
    manual: true
  - id: GENAI-SE-09
    title: "GENAI-SE-09. The threat model covers prompt injection, data leakage, data poisoning and wallet abuse"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-SE-09. Organisational -- confirm threats specific to AI are modelled and each has a control and a detection."
    manual: true
  - id: GENAI-SE-10
    title: "GENAI-SE-10. Access to AI resources is least privilege, with separate identities per environment"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-SE-10. Organisational -- confirm role assignments are scoped to what is needed, each deployment pipeline's identity is limited to its environment, and administrative access is just in time."
    manual: true

  # ---- Responsible AI and content safety (RA) -- 6 items --------------------
  - id: GENAI-RA-01
    title: "GENAI-RA-01. A content filter policy is bound to every model deployment"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RA-01. Organisational -- confirm each deployment screens prompts and completions, the default policy was reviewed against the workload, and custom policies are managed as code."
    manual: true
  - id: GENAI-RA-02
    title: "GENAI-RA-02. Prompt injection and jailbreak protection is enabled"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RA-02. Organisational -- confirm prompt shields or equivalent protection cover direct and indirect prompt attacks."
    manual: true
  - id: GENAI-RA-03
    title: "GENAI-RA-03. A Responsible AI impact assessment is complete"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RA-03. Organisational -- confirm potential harms, affected groups and mitigations were assessed before release, using Microsoft Responsible AI tools or equivalent."
    manual: true
  - id: GENAI-RA-04
    title: "GENAI-RA-04. Adversarial testing is done before release"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-RA-04. Organisational -- confirm red-team or adversarial testing was run against the solution and findings addressed."
    manual: true
  - id: GENAI-RA-05
    title: "GENAI-RA-05. Human oversight and user transparency are designed in"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-RA-05. Organisational -- confirm users know they are using AI, can see limits, and a person reviews high-stakes outputs."
    manual: true
  - id: GENAI-RA-06
    title: "GENAI-RA-06. Interactions are auditable and sensitive data in them is visible"
    severity: medium
    query: "$.domains.analytics.purviewAccounts[*]"
    assert: { type: manual }
    remediation: "GENAI-RA-06. Organisational -- confirm audit records and sensitive-data classification cover prompts and responses, for example through Microsoft Purview (Purview accounts are attached as evidence)."
    manual: true

  # ---- Reliability and capacity (RC) -- 5 items --------------------
  - id: GENAI-RC-01
    title: "GENAI-RC-01. Throttling and quota errors are handled"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RC-01. Organisational -- confirm the application retries with backoff on 429 responses and spreads load across deployments or regions."
    manual: true
  - id: GENAI-RC-02
    title: "GENAI-RC-02. Production capacity is planned, with provisioned throughput where demand is steady"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RC-02. Organisational -- confirm capacity was sized from load tests, with provisioned throughput or a quota increase in place before launch."
    manual: true
  - id: GENAI-RC-03
    title: "GENAI-RC-03. Disaster recovery covers model endpoints, indexes and orchestration"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RC-03. Organisational -- confirm backup and failover exist for model endpoints and supporting stores, and recovery has been tested."
    manual: true
  - id: GENAI-RC-04
    title: "GENAI-RC-04. Model retirement dates are tracked and replacement is tested ahead of time"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-RC-04. Organisational -- confirm model lifecycle and retirement schedules are monitored, with a tested path and rollback for moving to a replacement model."
    manual: true
  - id: GENAI-RC-05
    title: "GENAI-RC-05. Reliability targets are defined for each AI component"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-RC-05. Organisational -- confirm availability, latency and quality targets exist for models, search, orchestration and the application."
    manual: true

  # ---- Operations and monitoring (OP) -- 6 items --------------------
  - id: GENAI-OP-01
    title: "GENAI-OP-01. Diagnostic logs from AI resources go to a central workspace"
    severity: high
    query: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.cognitiveservices/accounts')]"
    assert: { type: manual }
    remediation: "GENAI-OP-01. Organisational -- confirm diagnostic settings on AI accounts, workspaces and search services send logs and metrics to Log Analytics (diagnostic coverage for Azure AI accounts is attached as evidence)."
    manual: true
  - id: GENAI-OP-02
    title: "GENAI-OP-02. Latency, token usage, throttling and output quality are monitored"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-OP-02. Organisational -- confirm operations dashboards cover both availability and quality metrics, agreed with data scientists."
    manual: true
  - id: GENAI-OP-03
    title: "GENAI-OP-03. Alerts exist for AI service health and quality"
    severity: medium
    query: "$.monitor.metricAlertRules[*]"
    assert: { type: manual }
    remediation: "GENAI-OP-03. Organisational -- confirm alert rules on service health, search and model endpoints notify people who can act (metric alert rules are attached as evidence)."
    manual: true
  - id: GENAI-OP-04
    title: "GENAI-OP-04. Evaluation runs in the delivery pipeline and in pre-production"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-OP-04. Organisational -- confirm changes to prompts, models and retrieval are evaluated automatically before reaching production."
    manual: true
  - id: GENAI-OP-05
    title: "GENAI-OP-05. Quality drift and model decay are monitored in production"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "GENAI-OP-05. Organisational -- confirm groundedness, relevance and completeness are tracked against thresholds, with action when they slip."
    manual: true
  - id: GENAI-OP-06
    title: "GENAI-OP-06. Prompts, indexes and orchestration are under source control and deployed as code"
    severity: medium
    query: "$.management.deployments[*]"
    assert: { type: manual }
    remediation: "GENAI-OP-06. Organisational -- confirm every AI asset is versioned and deployed through pipelines with infrastructure as code (ARM deployments are attached as evidence)."
    manual: true

  # ---- Cost and performance (CO) -- 4 items --------------------
  - id: GENAI-CO-01
    title: "GENAI-CO-01. Models are matched to the task, with smaller models for simple work"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-CO-01. Organisational -- confirm routing sends simple requests to lower-cost models and keeps larger models for complex work."
    manual: true
  - id: GENAI-CO-02
    title: "GENAI-CO-02. Token use is controlled"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-CO-02. Organisational -- confirm maximum tokens, concise prompts, caching and batching are used to limit consumption."
    manual: true
  - id: GENAI-CO-03
    title: "GENAI-CO-03. Cost is tracked per workload against a budget"
    severity: medium
    query: "$.governance.budgets[*]"
    assert: { type: manual }
    remediation: "GENAI-CO-03. Organisational -- confirm AI cost is attributed to workloads, with budgets and alerts (Azure budgets are attached as evidence)."
    manual: true
  - id: GENAI-CO-04
    title: "GENAI-CO-04. Performance benchmarks are set through experimentation"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "GENAI-CO-04. Organisational -- confirm latency and throughput benchmarks were established before go-live and are re-checked after significant changes."
    manual: true
