# win11.readiness.yaml -- Windows 11 Pro Migration Readiness Assessment (AB#9300 phase 5)
#
# Scout's review for Microsoft's "Windows 11 Pro Migration Readiness Assessment"
# (learn.microsoft.com/assessments/1020523c-e223-432c-8be1-ebbb348f8130). Microsoft does not publish that
# assessment's questions, so every item is SCOUT-DERIVED from Microsoft's Windows 11 planning guidance:
# plan for Windows 11, Windows 11 requirements, readiness criteria, infrastructure and tools, servicing
# calendar, application compatibility testing, endpoint analytics readiness, Intune feature updates and
# Windows Autopatch. The WIN11-* ids are Scout's own.
#
# Product status (checked 2026-11-25): Windows 10 reached end of support on 2025-10-14 (WIN11-PL-05 asks what
# has been decided for each remaining device). Nothing in the guidance used here is retired or renamed.
#
# Scout does not read client devices, Intune or Configuration Manager, so every rule is `manual: true` with
# `query: null`. Azure Arc-enabled servers and Azure VMs are NOT client devices and are never used as
# evidence. Answer the questions with -AssessmentAnswers. Written ONLY against
# docs/frameworks/windows-11-readiness-question-set.md.
area: "Windows 11 migration readiness"
framework: WIN11-READINESS
frameworkversion: "docs/frameworks/windows-11-readiness-question-set.md, extracted 2026-11-25 (Windows 11 planning, readiness and servicing guidance on Microsoft Learn, current as of the extraction date; no published version number); verified 2026-11-25"
weight: 1.0
verifiedAgainst: "docs/frameworks/windows-11-readiness-question-set.md, 34 Scout-derived items across 6 groups, verified 2026-11-25. The assessment's own question text and numbering are not published; the WIN11-* identifiers are Scout's own. Every item is a questionnaire item (manual: true, query: null): Scout does not read this product's data."
rules:
  # ---- PL -- Plan and servicing strategy (6 items) --------------------
  - id: WIN11-PL-01
    title: "WIN11-PL-01. A Windows 11 deployment plan exists, with scope, schedule and a process manager who can pause it"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-PL-01. Organisational -- confirm a written plan names the devices in scope, the phases (plan, prepare, pilot, broad deployment) and a process manager with authority to push the deployment forward or halt it."
    manual: true
  - id: WIN11-PL-02
    title: "WIN11-PL-02. The roles the deployment needs are filled (application owners, end-user computing, operations, security, stakeholders)"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-PL-02. Organisational -- confirm each role has a named person for the phases where it is active, so application certification, infrastructure, support and security approval do not stall."
    manual: true
  - id: WIN11-PL-03
    title: "WIN11-PL-03. Readiness criteria and go or no-go thresholds are defined, including acceptable call and incident trends"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-PL-03. Organisational -- confirm operations and support agreed what increase in calls and incidents is acceptable, and what blocks moving from pilot to broad deployment."
    manual: true
  - id: WIN11-PL-04
    title: "WIN11-PL-04. A servicing strategy with a calendar is defined, and the lifecycle of the edition in use is known"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-PL-04. Organisational -- confirm the organisation chose an annual or faster cadence for feature updates, and knows that Windows 11 Pro editions are supported for 24 months from a version general availability while Enterprise and Education editions are supported for 36 months."
    manual: true
  - id: WIN11-PL-05
    title: "WIN11-PL-05. Every device still on Windows 10 has a recorded decision now that Windows 10 has reached end of support (2025-10-14)"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-PL-05. Organisational -- confirm each remaining Windows 10 device is scheduled to be upgraded or replaced, or is enrolled in the paid Extended Security Updates programme with an end date, because it no longer receives free security updates."
    manual: true
  - id: WIN11-PL-06
    title: "WIN11-PL-06. Windows Insider Program for Business, Release Preview channel, is used to validate infrastructure and applications ahead of releases"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WIN11-PL-06. Organisational -- confirm a validation group of devices runs the Release Preview channel to check devices, applications and management tools before broad deployment."
    manual: true
  # ---- HW -- Hardware eligibility (8 items) --------------------
  - id: WIN11-HW-01
    title: "WIN11-HW-01. Every device is inventoried and assessed against the Windows 11 hardware requirements"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-01. Organisational -- confirm the device inventory is complete and each device was checked for processor, 4 GB memory, 64 GB storage, UEFI with Secure Boot, TPM 2.0, DirectX 12 graphics and display requirements."
    manual: true
  - id: WIN11-HW-02
    title: "WIN11-HW-02. A readiness report is used for managed devices (Intune endpoint analytics, Configuration Manager tenant attach, or equivalent)"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-02. Organisational -- confirm Windows 11 hardware readiness is read from endpoint analytics Work from anywhere (capable, not capable, upgraded, unknown) and the top hardware blockers are known."
    manual: true
  - id: WIN11-HW-03
    title: "WIN11-HW-03. Devices reported as not capable or unknown have an owner and an action"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-03. Organisational -- confirm not-capable devices are scheduled for refresh or retirement, and unknown devices (usually inactive) are checked against last check-in and cleaned up or brought online."
    manual: true
  - id: WIN11-HW-04
    title: "WIN11-HW-04. Capable devices with TPM or Secure Boot switched off in firmware are found and fixed"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-04. Organisational -- confirm devices that meet the hardware but fail on firmware settings are identified, and the settings are changed through the supported route before upgrade."
    manual: true
  - id: WIN11-HW-05
    title: "WIN11-HW-05. The hardware refresh plan prioritises devices that cannot upgrade"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-05. Organisational -- confirm the refresh budget and schedule follow the not-capable list, so eligible devices are upgraded first and the rest are replaced on a known date."
    manual: true
  - id: WIN11-HW-06
    title: "WIN11-HW-06. Virtual machines meet the Windows 11 virtual machine requirements"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-06. Organisational -- confirm virtual machines are generation 2 with Secure Boot and a virtual TPM (Trusted launch in Azure), at least 2 virtual processors, 4 GB memory and 64 GB disk, and that generation 1 machines are replaced because they cannot be upgraded in place."
    manual: true
  - id: WIN11-HW-07
    title: "WIN11-HW-07. Windows 10 devices meet the direct upgrade prerequisites, and S mode devices have been switched out"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-07. Organisational -- confirm devices run Windows 10 version 2004 or later with the September 14, 2021 or later update, and Pro devices in S mode are switched out of S mode first (which needs internet access and cannot be reversed)."
    manual: true
  - id: WIN11-HW-08
    title: "WIN11-HW-08. Feature-specific hardware needs of the organisation are checked (Windows Hello, Teams peripherals, Client Hyper-V, BitLocker to Go)"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WIN11-HW-08. Organisational -- confirm devices that must use features beyond the minimum (biometric sign-in, video conferencing, second-level address translation for Client Hyper-V on Pro) have the hardware those features need."
    manual: true
  # ---- AP -- Applications and peripherals (5 items) --------------------
  - id: WIN11-AP-01
    title: "WIN11-AP-01. Applications are inventoried and classified as critical, important or not important, with priority and severity defined"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-AP-01. Organisational -- confirm every application has a classification and a priority and severity scheme that decides whether a compatibility problem stops the deployment."
    manual: true
  - id: WIN11-AP-02
    title: "WIN11-AP-02. Each critical and important application has an owner and a test plan"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-AP-02. Organisational -- confirm application owners define the test plan, assign acceptance testers and certify the application for Windows 11."
    manual: true
  - id: WIN11-AP-03
    title: "WIN11-AP-03. Applications were tested on Windows 11 using the Microsoft testing guidelines, including the upgrade scenario"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-AP-03. Organisational -- confirm install, update, core function, extended features, uninstall and the Windows 10 to Windows 11 upgrade scenario were tested, and Windows 11 interface features such as taskbar and snap layouts were covered."
    manual: true
  - id: WIN11-AP-04
    title: "WIN11-AP-04. App Assure is used for compatibility issues the organisation cannot resolve"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-AP-04. Organisational -- confirm the team knows the App Assure service (free for eligible customers with more than 150 devices) and uses it when an application will not work on Windows 11."
    manual: true
  - id: WIN11-AP-05
    title: "WIN11-AP-05. Drivers, printers, scanners and line-of-business hardware were validated for Windows 11"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-AP-05. Organisational -- confirm peripherals and drivers used by the organisation were checked against Windows 11, with replacements planned for those without support."
    manual: true
  # ---- MG -- Management, deployment and update control (7 items) --------------------
  - id: WIN11-MG-01
    title: "WIN11-MG-01. Endpoint management tools are current and support Windows 11"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-01. Organisational -- confirm Intune is in use, or Configuration Manager is on a current branch with a cloud management gateway, tenant attach or co-management, and any non-Microsoft tool supports the Windows 11 feature update."
    manual: true
  - id: WIN11-MG-02
    title: "WIN11-MG-02. Devices are Microsoft Entra joined or hybrid joined and enrolled for management"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-02. Organisational -- confirm devices are Entra joined or hybrid joined and enrolled in Intune (or co-managed), which is also what Windows Autopatch needs."
    manual: true
  - id: WIN11-MG-03
    title: "WIN11-MG-03. Feature update policies target Windows 11, and the handling of devices that cannot run it is decided"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-03. Organisational -- confirm Intune or Windows Autopatch feature update policies target the Windows 11 version, and the choice to install the latest Windows 10 feature update on not-capable devices was made on purpose, because a not-capable device targeted with Windows 11 stops getting Windows 10 feature updates automatically."
    manual: true
  - id: WIN11-MG-04
    title: "WIN11-MG-04. Windows Autopatch rings or an equivalent staged rollout is configured, and the licence and edition prerequisites are met"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-04. Organisational -- confirm update rings (test, first, fast, broad or the organisation own) exist, the Windows Pro, Enterprise or Education editions in use are supported, and licences such as Microsoft 365 Business Premium, Windows Enterprise E3 or F3 cover the devices."
    manual: true
  - id: WIN11-MG-05
    title: "WIN11-MG-05. Existing update policies, administrative templates and WSUS settings were reviewed for conflict with the new policies"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-05. Organisational -- confirm Group Policy, Intune and WSUS or scan source settings do not conflict, and the administrative templates match the Windows 11 version."
    manual: true
  - id: WIN11-MG-06
    title: "WIN11-MG-06. The deployment method is chosen: in-place upgrade through feature updates, or new and reprovisioned devices"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-06. Organisational -- confirm the organisation decided which devices upgrade in place and which are replaced or reprovisioned, using the same deployment tools it uses for Windows 10."
    manual: true
  - id: WIN11-MG-07
    title: "WIN11-MG-07. Deployment progress, failures and safeguard holds are monitored through update reporting"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-MG-07. Organisational -- confirm Windows Update for Business reports or Autopatch reporting show which devices upgraded, failed or are held, and someone acts on safeguard holds."
    manual: true
  # ---- SC -- Security baseline (4 items) --------------------
  - id: WIN11-SC-01
    title: "WIN11-SC-01. Microsoft security baselines for Windows 11 are applied and kept current"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-SC-01. Organisational -- confirm the Windows 11 security baseline from the Security Compliance Toolkit (and any industry or regional baseline that applies) is deployed and updated with each release."
    manual: true
  - id: WIN11-SC-02
    title: "WIN11-SC-02. Device protection features are enabled: BitLocker, Windows Hello for Business, Defender Firewall, SmartScreen, application control"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-SC-02. Organisational -- confirm the built-in Windows protections the organisation relies on are configured through Intune, Group Policy or another tool, and checked after upgrade."
    manual: true
  - id: WIN11-SC-03
    title: "WIN11-SC-03. Compliance policies and Conditional Access require healthy, compliant devices"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-SC-03. Organisational -- confirm Intune compliance policies exist and Conditional Access requires compliant devices, so a device that falls out of policy after the upgrade loses access."
    manual: true
  - id: WIN11-SC-04
    title: "WIN11-SC-04. The security team reviewed and approved the baseline and tools before pilot"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-SC-04. Organisational -- confirm the security role signed off the security baseline and deployment tooling before the pilot started."
    manual: true
  # ---- OP -- Operations and user readiness (4 items) --------------------
  - id: WIN11-OP-01
    title: "WIN11-OP-01. Support readiness is in place: documentation, process changes and a defined rollback"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-OP-01. Organisational -- confirm the support team updated documentation and processes for Windows 11, knows the acceptable call and incident trends, and has a rollback and post-deployment support process."
    manual: true
  - id: WIN11-OP-02
    title: "WIN11-OP-02. Users are told what changes and how to get help"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-OP-02. Organisational -- confirm users receive communication and training on the Windows 11 interface and on how to ask for support before their device is upgraded."
    manual: true
  - id: WIN11-OP-03
    title: "WIN11-OP-03. A pilot group is representative of the organisation before broad deployment"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WIN11-OP-03. Organisational -- confirm the pilot includes the departments, hardware models and critical applications the broad deployment will meet, and that pilot results gate the next ring."
    manual: true
  - id: WIN11-OP-04
    title: "WIN11-OP-04. Ongoing servicing is planned: monthly quality updates and an annual feature update"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WIN11-OP-04. Organisational -- confirm the organisation has an owner and a calendar for monthly quality updates and the annual feature update, so devices do not fall out of support again."
    manual: true
