# pp.solution.yaml — Power Platform Solution Assessment (AB#9300, phase 5)
#
# Scores Microsoft's "Power Platform Solution Assessment"
# (learn.microsoft.com/assessments/a5c3b65d-bf7e-4743-850a-0437ae692690), which Microsoft describes as a
# review of "every aspect of the solution, from functionality and user experience to its alignment with
# overall business goals".
#
# Written ONLY against docs/frameworks/power-platform-solution-question-set.md. Microsoft does not
# publish this assessment's question text or numbering, so every PPSOL-* item is Scout's own reading of
# the Power Platform guidance (ALM, adoption and Well-Architected) named per item, and the identifiers
# are Scout's. Say so wherever the output is quoted.
#
# SCOUT DOES NOT READ POWER PLATFORM DATA YET. Every rule below is manual: true with query: null, so
# the answers come from the questionnaire (docs/assessment/questionnaire-answers.md). No rule queries
# collect.json. Until answered these items show as Manual and are left out of the score.
area: "Power Platform Solution"
framework: PP-SOLUTION
frameworkversion: "Power Platform Solution Assessment (questions unpublished) read against Power Platform ALM, adoption and Well-Architected guidance on Microsoft Learn, docs/frameworks/power-platform-solution-question-set.md, verified 2026-11-25"
weight: 1.0
verifiedAgainst: "docs/frameworks/power-platform-solution-question-set.md (Scout enumeration of learn.microsoft.com/power-platform/alm, /guidance/adoption and /well-architected, 37 items across five groups), verified 2026-11-25. Assessment question text is not published; the questions are Scout-derived."
rules:
  # ---- Business alignment (PPSOL-BG) ------------------------------------------------------
  - id: PPSOL-BG-01
    title: "PPSOL-BG-01. The solution has documented business objectives and measurable success criteria agreed before build"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-BG-01. Organisational -- Confirm objectives and key results were written down before development started and that success can be measured against them. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/alm; learn.microsoft.com/power-platform/guidance/adoption/business-value."
    manual: true
  - id: PPSOL-BG-02
    title: "PPSOL-BG-02. A business owner and an executive sponsor are named for the solution"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-BG-02. Organisational -- Confirm an accountable business owner and an executive sponsor exist and know what they are accountable for. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/strategy-best-practices; learn.microsoft.com/power-platform/guidance/adoption/roles."
    manual: true
  - id: PPSOL-BG-03
    title: "PPSOL-BG-03. Business, IT, end-user and compliance stakeholders took part in defining the solution"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-BG-03. Organisational -- Confirm the stakeholders who are affected, or who must approve, were identified and engaged, for example through a solution envisioning workshop. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/solution-envisioning."
    manual: true
  - id: PPSOL-BG-04
    title: "PPSOL-BG-04. The solution's business value is measured and reported after go-live"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-BG-04. Organisational -- Confirm the value the solution was meant to deliver (time saved, cost, accuracy) is measured and reported to the sponsor. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/business-value."
    manual: true
  - id: PPSOL-BG-05
    title: "PPSOL-BG-05. Power Platform was chosen deliberately against alternatives, and the level of formality is set by the solution's complexity and criticality"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-BG-05. Organisational -- Confirm a decision, not a default, put this on Power Platform, and that low-code is not treated as low complexity, for example by using a decision matrix. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/alm; learn.microsoft.com/power-platform/guidance/adoption/application-modernization."
    manual: true
  - id: PPSOL-BG-06
    title: "PPSOL-BG-06. The solution is classified by criticality and the classification sets its availability, support and recovery requirements"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-BG-06. Organisational -- Confirm the solution is rated (for example mission critical or not) and that rating drives its resilience and support tier. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/plan-mission-critical; learn.microsoft.com/power-platform/guidance/adoption/availability-overview."
    manual: true
  # ---- Functionality and design (PPSOL-FN) ------------------------------------------------------
  - id: PPSOL-FN-01
    title: "PPSOL-FN-01. Requirements are captured, prioritised by business value and traceable to solution components"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-01. Organisational -- Confirm requirements are held in one prioritised backlog and each can be traced to the app, flow, table or agent that meets it. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/alm; learn.microsoft.com/power-platform/well-architected/operational-excellence/checklist."
    manual: true
  - id: PPSOL-FN-02
    title: "PPSOL-FN-02. All components (apps, flows, agents, tables and other assets) are held in Dataverse solutions rather than built loose"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-02. Organisational -- Confirm every deployable asset belongs to a solution so it can be versioned and moved between environments. Scout-derived from: learn.microsoft.com/power-platform/alm/overview-alm; learn.microsoft.com/power-platform/guidance/adoption/environment-strategy."
    manual: true
  - id: PPSOL-FN-03
    title: "PPSOL-FN-03. The data model is designed deliberately, with the data store, tables and relationships chosen and documented for the workload"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-03. Organisational -- Confirm the data model was designed and documented for the workload's access patterns, not grown ad hoc, and that the data store choice has a recorded rationale. Scout-derived from: learn.microsoft.com/power-platform/well-architected/performance-efficiency/checklist; learn.microsoft.com/power-platform/alm/overview-alm."
    manual: true
  - id: PPSOL-FN-04
    title: "PPSOL-FN-04. Security roles and sharing follow least privilege for each type of user"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-04. Organisational -- Confirm roles are defined per persona, access is granted through roles and groups rather than ad hoc sharing, and elevated roles are limited. Scout-derived from: learn.microsoft.com/power-platform/well-architected/security/checklist; learn.microsoft.com/power-platform/guidance/adoption/roles."
    manual: true
  - id: PPSOL-FN-05
    title: "PPSOL-FN-05. Connectors and connections are approved under the tenant data policies, and shared solutions use service identities rather than a maker's personal connection"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-05. Organisational -- Confirm the connectors in use are permitted by data policy and that production flows and apps do not depend on a named maker's credentials. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/dlp-strategy; learn.microsoft.com/power-platform/guidance/adoption/govern-at-scale."
    manual: true
  - id: PPSOL-FN-06
    title: "PPSOL-FN-06. Environment-specific settings are held in environment variables and connection references, not hard-coded"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-06. Organisational -- Confirm URLs, identifiers and connections that differ per environment are parameterised so the same solution deploys unchanged. Scout-derived from: learn.microsoft.com/microsoft-copilot-studio/guidance/alm; learn.microsoft.com/power-platform/alm/overview-alm."
    manual: true
  - id: PPSOL-FN-07
    title: "PPSOL-FN-07. Integrations with other systems are documented, with error handling and platform request limits taken into account"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-07. Organisational -- Confirm each integration is documented with its owner, authentication, failure behaviour and the throttling or request limits that apply. Scout-derived from: learn.microsoft.com/power-platform/well-architected/reliability/checklist; learn.microsoft.com/power-platform/well-architected/performance-efficiency/checklist."
    manual: true
  - id: PPSOL-FN-08
    title: "PPSOL-FN-08. Licences needed by every user and component (premium connectors, per-user or per-app, capacity) are identified before rollout"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-08. Organisational -- Confirm the licensing needed for the full user population and each component is known and budgeted. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/license-assignment-strategies; learn.microsoft.com/power-platform/guidance/adoption/cds-usage."
    manual: true
  - id: PPSOL-FN-09
    title: "PPSOL-FN-09. Apps and flows have a named owner, and ownership survives a maker leaving"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-09. Organisational -- Confirm each production app and flow has an owner or co-owners and a team or service owner, so an individual leaving does not orphan it. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/roles; learn.microsoft.com/power-platform/guidance/adoption/govern-at-scale."
    manual: true
  - id: PPSOL-FN-10
    title: "PPSOL-FN-10. AI components (agents, AI Builder models, Copilot features) have a defined purpose, boundaries, human oversight and a responsible-AI review"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-FN-10. Organisational -- Confirm any AI in the solution has a stated purpose, limits on what it may do, human oversight where it matters, and a responsible-AI review. Not applicable if the solution has no AI components. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/solution-envisioning; learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  # ---- User experience (PPSOL-UX) ------------------------------------------------------
  - id: PPSOL-UX-01
    title: "PPSOL-UX-01. The target users and their tasks are identified, and users were involved in the design"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-01. Organisational -- Confirm personas and tasks are documented and users reviewed the design before release. Scout-derived from: learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  - id: PPSOL-UX-02
    title: "PPSOL-UX-02. The interface follows consistent design standards, navigation and terminology"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-02. Organisational -- Confirm there is a design standard (layout, naming, navigation) and the solution follows it. Scout-derived from: learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  - id: PPSOL-UX-03
    title: "PPSOL-UX-03. Accessibility needs are designed for and tested"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-03. Organisational -- Confirm accessibility requirements were identified (for example keyboard use, screen readers, contrast) and tested before release. Scout addition: accessibility is not its own line on the Well-Architected checklist. Scout-derived from: learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  - id: PPSOL-UX-04
    title: "PPSOL-UX-04. The layout works on the devices and screen sizes users have"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-04. Organisational -- Confirm the solution was checked on the devices users actually use, including mobile where relevant. Scout-derived from: learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  - id: PPSOL-UX-05
    title: "PPSOL-UX-05. App and flow response times meet defined targets and are measured with real users"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-05. Organisational -- Confirm response-time targets exist and are checked against real usage, not only developer testing. Scout-derived from: learn.microsoft.com/power-platform/well-architected/performance-efficiency/checklist."
    manual: true
  - id: PPSOL-UX-06
    title: "PPSOL-UX-06. Messages, notifications and errors tell users what happened and what to do next"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-06. Organisational -- Confirm error and confirmation messages are written for users and give a next step. Scout-derived from: learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  - id: PPSOL-UX-07
    title: "PPSOL-UX-07. Users are onboarded with training and help content for the solution"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-07. Organisational -- Confirm users receive training, guides or in-app help before and after go-live. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/training-strategy; learn.microsoft.com/power-platform/guidance/adoption/ready-overview."
    manual: true
  - id: PPSOL-UX-08
    title: "PPSOL-UX-08. Users have a channel for feedback and enhancement requests, and it is acted on"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "PPSOL-UX-08. Organisational -- Confirm there is a place to send feedback and a process that turns it into backlog items. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/govern-at-scale; learn.microsoft.com/power-platform/well-architected/experience-optimization/checklist."
    manual: true
  # ---- Delivery and ALM (PPSOL-DL) ------------------------------------------------------
  - id: PPSOL-DL-01
    title: "PPSOL-DL-01. Separate development, test and production environments are used"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-01. Organisational -- Confirm work is built in a development environment, tested in a test environment and run in production, and that makers do not edit production directly. Scout-derived from: learn.microsoft.com/power-platform/alm/overview-alm; learn.microsoft.com/power-platform/guidance/adoption/environment-strategy."
    manual: true
  - id: PPSOL-DL-02
    title: "PPSOL-DL-02. Solutions are held in source control as the source of truth"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-02. Organisational -- Confirm the unpacked solution is committed to source control, using Git integration or the build tools, and changes are reviewed. Scout-derived from: learn.microsoft.com/power-platform/alm/overview-alm; learn.microsoft.com/power-platform/guidance/adoption/application-modernization."
    manual: true
  - id: PPSOL-DL-03
    title: "PPSOL-DL-03. Deployments between environments are automated through pipelines"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-03. Organisational -- Confirm deployments run through Power Platform pipelines, or through Azure DevOps or GitHub with the Power Platform build tools or CLI, rather than manual export and import. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/alm; learn.microsoft.com/power-platform/guidance/adoption/application-modernization."
    manual: true
  - id: PPSOL-DL-04
    title: "PPSOL-DL-04. Solution checker, or an equivalent static check, is run and its findings resolved before deployment"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-04. Organisational -- Confirm every release is checked for known problem patterns and high-severity findings block promotion. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/environment-strategy."
    manual: true
  - id: PPSOL-DL-05
    title: "PPSOL-DL-05. Managed solutions with version numbers are deployed to test and production"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-05. Organisational -- Confirm test and production receive versioned, managed solutions, and unmanaged customisations are not made directly in production. Scout reading of ALM guidance. Scout-derived from: learn.microsoft.com/power-platform/alm/overview-alm."
    manual: true
  - id: PPSOL-DL-06
    title: "PPSOL-DL-06. Functional, regression and user acceptance testing are defined and performed before release"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-06. Organisational -- Confirm test cases exist and are run for each release, including acceptance by business users. Scout-derived from: learn.microsoft.com/power-platform/well-architected/operational-excellence/checklist; learn.microsoft.com/power-platform/guidance/adoption/alm."
    manual: true
  - id: PPSOL-DL-07
    title: "PPSOL-DL-07. A rollback or feature-disable plan exists for failed releases"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-07. Organisational -- Confirm there is a tested way to back out or switch off a failed release quickly. Scout-derived from: learn.microsoft.com/power-platform/well-architected/operational-excellence/checklist."
    manual: true
  - id: PPSOL-DL-08
    title: "PPSOL-DL-08. Design, data model and support runbook documentation is current"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "PPSOL-DL-08. Organisational -- Confirm documentation exists and is kept in step with releases so support and new team members can use it. Scout-derived from: learn.microsoft.com/power-platform/well-architected/operational-excellence/checklist."
    manual: true
  # ---- Operate (PPSOL-OP) ------------------------------------------------------
  - id: PPSOL-OP-01
    title: "PPSOL-OP-01. Solution health is monitored with alerts, using the admin centre Monitor area, Application Insights or an equivalent"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-OP-01. Organisational -- Confirm solution-level health, errors and performance are monitored and that someone is alerted when they degrade. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/observability."
    manual: true
  - id: PPSOL-OP-02
    title: "PPSOL-OP-02. A support model and escalation path for the solution is defined and known to users"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-OP-02. Organisational -- Confirm users know where to get help and that support has a defined escalation path to the owner and to the platform admins. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/support-strategy; learn.microsoft.com/power-platform/guidance/adoption/operate-overview."
    manual: true
  - id: PPSOL-OP-03
    title: "PPSOL-OP-03. Backup, restore and retention for the solution's environment and data are understood and tested"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "PPSOL-OP-03. Organisational -- Confirm the environment backup, restore and data-retention options meet the solution's recovery needs and a restore has been tried. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/data-retention; learn.microsoft.com/power-platform/guidance/adoption/plan-disaster-recovery."
    manual: true
  - id: PPSOL-OP-04
    title: "PPSOL-OP-04. Capacity and licence consumption of the solution is monitored"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "PPSOL-OP-04. Organisational -- Confirm storage, request and licence consumption for the solution are watched so limits are not hit unexpectedly. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/observability; learn.microsoft.com/power-platform/guidance/adoption/cds-usage."
    manual: true
  - id: PPSOL-OP-05
    title: "PPSOL-OP-05. Criteria for retiring the solution and its environment are defined"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "PPSOL-OP-05. Organisational -- Confirm there is a lifecycle for retiring unused apps, flows and environments, with an owner who decides. Scout-derived from: learn.microsoft.com/power-platform/guidance/adoption/environment-strategy; learn.microsoft.com/power-platform/guidance/adoption/admin-best-practices."
    manual: true
