# wara.reliability.yaml -- Well-Architected Reliability Assessment (WARA) style checks, backed by the
# Azure Proactive Resiliency Library (APRL) (AB#9300)
#
# WARA is Microsoft's automated reliability review: its PowerShell module (Azure/Well-Architected-
# Reliability-Assessment) runs the Azure Resource Graph queries APRL publishes per resource type and
# turns the hits into a reliability action plan. This file does the same job from the data Scout has
# ALREADY collected into collect.json, so it needs no extra Azure call and no extra permission.
#
# Written ONLY against docs/frameworks/wara-aprl-checklist.md. Every rule cites an item id from that
# page; each item names the APRL recommendation (aprlGuid) it paraphrases and the repo path it was
# read from. APRL is MIT licensed (github.com/Azure/Azure-Proactive-Resiliency-Library-v2); nothing
# here is copied from it, the wording and the conditions are Scout's, and the conditions use only
# properties Scout really collects. Where APRL needs a property Scout does not collect yet, the item
# is either a Manual rule that attaches the nearest evidence, or it is listed in the doc under
# "Needs a new projection" with no rule at all (a rule on an uncollected property would score the
# estate on nothing). Phase 4 of AB#9300 added the zone, tier, HA-mode, autoscale and instance-count
# fields to collect.json, which is what turned the zone / HA / tier items from Manual into scored
# rules and added the scale set, public IP and load balancer frontend rules.
#
# Every rule is gated on its own resource type existing, so an estate without that service reports
# the rule Not assessed rather than passed or failed.
#
# Known simplifications, repeated in each affected remediation so a reader is never surprised:
#   - Scout's zone-eligibility signal for virtual machines is a documented region list, not the
#     per-SKU zone capability APRL's own query uses.
#   - SQL databases, AKS clusters, storage accounts and Event Hubs namespaces carry no `location`
#     in Scout's projection, so "no zone" findings can include a region that has no zones. The
#     remediation says to record an exception in that case. The zone rules added in phase 4
#     (scale sets, public IPs, firewalls, gateways, caches, databases) have the same limit.
#   - A zone count Resource Graph reports as null means the resource has no `zones` array, that is,
#     it is not zonal. JSONPath compares null as lower than any number, so `zoneCount < 2` matches
#     both 0 and null; a property that is missing from the row altogether matches nothing.
#   - Newtonsoft JSONPath has no parentheses, so a filter that mixes && and || nests to the RIGHT:
#     `a && b || c` reads `a && (b || c)` and `a || b && c` reads `a || (b && c)`. WARA-ASP-02 and
#     WARA-REDIS-01 rely on that and tests/Assessment.WaraAdvisor.Tests.ps1 pins the result, so a
#     JSONPath library change that breaks it fails a test instead of silently scoring the estate.
area: "Reliability (WARA / APRL)"
framework: WARA
frameworkversion: "Azure Proactive Resiliency Library v2 (APRL) azure-resources/*/recommendations.yaml on main + Microsoft Learn reliability guides by service, docs/frameworks/wara-aprl-checklist.md, read 2026-11-25 (38 items: 36 automated, 2 manual)"
weight: 1.0
verifiedAgainst: "docs/frameworks/wara-aprl-checklist.md (Scout enumeration of github.com/Azure/Azure-Proactive-Resiliency-Library-v2 and learn.microsoft.com/azure/reliability/overview-reliability-guidance), verified 2026-11-25"
rules:
  # ---- Compute: virtual machines and disks (WARA-VM, WARA-DSK) --------------------------------
  - id: WARA-VM-01
    title: "WARA-VM-01. Virtual machines in a region with availability zones are deployed to a zone"
    severity: high
    aprl: "2bd0be95-a825-6f47-a8c6-3db1fb5eb387"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachines"
    query: "$.compute.virtualMachines[?(@.zoneEligible == true && @.zoneRedundant == false)]"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachines[*]" }
    remediation: "WARA-VM-01. The virtual machines listed run in a region that has availability zones but are not placed in one, so a single datacenter failure takes them down. Redeploy them into zones (or behind a zone-redundant scale set). Scout judges zone support from a fixed region list, not the VM size, so a size that cannot use zones is an exception to record, not a defect."
    manual: false
  - id: WARA-VM-02
    title: "WARA-VM-02. Every virtual machine has an Azure Backup protected item"
    severity: medium
    aprl: "1981f704-97b9-b645-9c57-33f8ded9261a"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachines"
    join:
      left: "$.compute.virtualMachines[*]"
      leftKey: "id"
      right: "$.management.backupProtectedItems[*]"
      rightKey: "sourceResourceId"
      mode: leftOnly
      leftLabel: "virtual machine"
      rightLabel: "backup protected item"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachines[*]" }
    remediation: "WARA-VM-02. The virtual machines listed have no protected item in any Recovery Services vault in scope. Put them on a backup policy, or record why the workload is stateless or protected another way (Site Recovery alone is not a backup)."
    manual: false
  - id: WARA-VM-03
    title: "WARA-VM-03. Production virtual machines do not run on burstable B-series sizes"
    severity: high
    aprl: "3201dba8-d1da-4826-98a4-104066545170"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachines"
    query: "$.compute.virtualMachines[?(@.size =~ /^Standard_B/i)]"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachines[*]" }
    remediation: "WARA-VM-03. The virtual machines listed use a burstable B-series size, which throttles to a baseline CPU once its credits run out. That is fine for dev and test; for production that needs steady CPU move to a non-burstable family. Scout cannot tell production from test, so confirm the environment before acting."
    manual: false
  - id: WARA-VM-04
    title: "WARA-VM-04. Virtual machines are not placed in an availability set"
    severity: high
    aprl: "a8d25876-7951-b646-b4e8-880c9031596b"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachines"
    query: "$.compute.virtualMachines[?(@.inAvailabilitySet == true)]"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachines[*]" }
    remediation: "WARA-VM-04. The virtual machines listed are in an availability set, which spreads them over fault and update domains inside ONE datacenter, so a datacenter failure takes the whole set down. Move them to availability zones (or a zonal Flexible scale set); the machine has to be redeployed, since the placement cannot be changed in place. In a region that has no availability zones an availability set is still the right choice, so record that as an exception. inAvailabilitySet is true only when the VM names an availability set; null or absent reads as no set."
    manual: false
  - id: WARA-VM-05
    title: "WARA-VM-05. Virtual machine operating system disks are managed disks"
    severity: high
    aprl: "122d11d7-b91f-8747-a562-f56b79bcfbdc"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachines"
    query: "$.compute.virtualMachines[?(@.unmanagedOsDisk == true)]"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachines[*]" }
    remediation: "WARA-VM-05. The virtual machines listed boot from an unmanaged disk, a VHD blob in a storage account the VM owner has to size and spread by hand; one storage account's limits and outage then affect every VM that shares it, and unmanaged disks are being retired. Convert them to managed disks. unmanagedOsDisk is true only when the OS disk names a VHD uri (the uri itself is never collected); null or absent reads as a managed disk, which is what ARM defaults to."
    manual: false
  - id: WARA-VMSS-01
    title: "WARA-VMSS-01. Virtual machine scale sets are spread across availability zones"
    severity: high
    aprl: "1422c567-782c-7148-ac7c-5fc14cf45adc"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachineScaleSets"
    # Scout has no zone-capable region list for scale sets, so the finding is zoneCount < 1
    # (0 and null both match; null is how Resource Graph reports a scale set with no zones array).
    query: "$.compute.virtualMachineScaleSets[?(@.zoneCount < 1)]"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachineScaleSets[*]" }
    remediation: "WARA-VMSS-01. The scale sets listed have no availability zone, so every instance sits in one datacenter. Zones cannot be added to an existing scale set: create a zonal (ideally Flexible) scale set across all the region's zones and move the workload. Scout has no list of zone-capable regions for scale sets (the list it keeps is for single virtual machines), so a scale set in a region without zones, or a size that cannot use zones, shows up here as a false positive: record those as exceptions. Both Flexible and Uniform scale sets are checked. A null zone count reads as no zones."
    manual: false
  - id: WARA-VMSS-02
    title: "WARA-VMSS-02. Virtual machine scale sets have automatic instance repairs turned on"
    severity: high
    aprl: "820f4743-1f94-e946-ae0b-45efafd87962"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachineScaleSets"
    query: "$.compute.virtualMachineScaleSets[?(@.automaticRepairs != true)]"
    assert: { type: countEquals, value: 0, gate: "$.compute.virtualMachineScaleSets[*]" }
    remediation: "WARA-VMSS-02. The scale sets listed do not have automatic instance repairs on, so an unhealthy instance stays in rotation until someone replaces it. Turn the policy on; it needs an application health extension or a load balancer health probe to judge health. A scale set that never set the policy has no automaticRepairsPolicy, which ARM treats as off, so null and absent values are reported the same as an explicit false."
    manual: false
  - id: WARA-DSK-01
    title: "WARA-DSK-01. Attached managed disks are Premium SSD or better where the workload needs a higher uptime SLA"
    severity: medium
    aprl: "df0ff862-814d-45a3-95e4-4fad5a244ba6"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Compute/virtualMachines"
    query: "$.domains.storage.managedDisks[?(@.diskState == 'Attached' && @.sku =~ /^(Standard_LRS|StandardSSD_LRS|StandardSSD_ZRS)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.managedDisks[?(@.diskState == 'Attached')]" }
    remediation: "WARA-DSK-01. The attached disks listed are Standard HDD or Standard SSD. A single-instance virtual machine only gets the higher availability SLA when every disk is Premium SSD, Premium SSD v2 or Ultra. Move disks of mission-critical VMs to Premium; leave dev and test disks as they are."
    manual: false

  # ---- Containers: AKS and Container Registry (WARA-AKS, WARA-ACR) ---------------------------
  - id: WARA-AKS-01
    title: "WARA-AKS-01. Every AKS node pool spans availability zones"
    severity: high
    aprl: "4f63619f-5001-439c-bacb-8de891287727"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/ContainerService/managedClusters"
    query: "$.domains.containers.aksClusters[?(@.allPoolsZoned == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WARA-AKS-01. The clusters listed have at least one node pool with no availability zone. Zones cannot be added to an existing pool: add a zonal pool, move workloads, and remove the old one. Scout does not collect the cluster region, so a cluster in a region without zones is an exception to record."
    manual: false
  - id: WARA-AKS-02
    title: "WARA-AKS-02. AKS clusters use Microsoft Entra ID integration instead of local accounts"
    severity: high
    aprl: "ca324d71-54b0-4a3e-b9e4-10e767daa9fc"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/ContainerService/managedClusters"
    query: "$.domains.containers.aksClusters[?(@.aadIntegrated == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WARA-AKS-02. The clusters listed have no Microsoft Entra ID integration, so access runs on local Kubernetes accounts that cannot be audited per person. Enable Entra integration with Azure RBAC for Kubernetes and disable local accounts."
    manual: false
  - id: WARA-AKS-03
    title: "WARA-AKS-03. Production clusters are on the Standard or Premium tier with autoscaling and at least three system nodes"
    severity: high
    aprl: "0611251f-e70f-4243-8ddd-cfe894bec2e7"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/ContainerService/managedClusters"
    # An empty tier reads as Free, which is what ARM defaults to. systemPoolMinNodes is the smallest
    # a system pool may fall to (minCount when it autoscales, else its fixed count); null means no
    # readable system pool and is reported, since null compares below 3.
    query: "$.domains.containers.aksClusters[?(@.tier =~ /^(free)?$/i || @.systemPoolMinNodes < 3 || @.allPoolsAutoscale == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WARA-AKS-03. The clusters listed fail at least one of three checks: they are on the Free tier (no uptime SLA; an empty tier is read as Free, the ARM default), their system node pool can fall to fewer than three nodes (its autoscaler minimum, or its fixed count, or no readable system pool), or at least one node pool does not use the cluster autoscaler. Move production clusters to Standard or Premium, keep three or more system nodes and turn the autoscaler on for every pool. Scout cannot tell production from test, so a dev cluster on Free is an exception to record."
    manual: false
  - id: WARA-ACR-01
    title: "WARA-ACR-01. Container registries that serve production are on the Premium tier (zone redundancy and geo-replication)"
    severity: medium
    aprl: "eb005943-40a8-194b-9db2-474d430046b7"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/ContainerRegistry/registries"
    query: "$.domains.containers.containerRegistries[?(@.sku =~ /^(Basic|Standard)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.containerRegistries[*]" }
    remediation: "WARA-ACR-01. The registries listed are Basic or Standard, which cannot use zone redundancy or geo-replication. Move registries that production deployments pull from to Premium and replicate to the regions you deploy in. A registry used only by dev and test can stay as it is."
    manual: false

  # ---- Web: App Service plans (WARA-ASP) ------------------------------------------------------
  - id: WARA-ASP-01
    title: "WARA-ASP-01. App Service plans are on a Standard, Premium or Isolated tier"
    severity: high
    aprl: "b2113023-a553-2e41-9789-597e2fb54c31"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Web/serverFarms"
    query: "$.domains.web.appServicePlans[?(@.sku =~ /^(F1|D1|B1|B2|B3|Free|Shared|Basic)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.appServicePlans[*]" }
    remediation: "WARA-ASP-01. The plans listed are Free, Shared or Basic. Those tiers have no zone support, no deployment slots, limited scale-out and (Free, Shared) no SLA. Move production apps to Standard, Premium v3 or Isolated v2."
    manual: false
  - id: WARA-ASP-02
    title: "WARA-ASP-02. Production App Service plans are zone redundant and run at least two instances"
    severity: high
    aprl: "88cb90c2-3b99-814b-9820-821a63f600dd"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Web/serverFarms"
    # The tier filter keeps Free, Shared, Basic and consumption plans out (WARA-ASP-01 owns those).
    # `A && B || C` nests as A && (B || C), so the instance count applies to Standard-and-above
    # plans only; the test file pins that.
    query: "$.domains.web.appServicePlans[?(@.tier =~ /^(Standard|Premium|Isolated|Elastic|Workflow)/i && @.zoneRedundant != true || @.instanceCount < 2)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.appServicePlans[?(@.tier =~ /^(Standard|Premium|Isolated|Elastic|Workflow)/i)]" }
    remediation: "WARA-ASP-02. The Standard-and-above plans listed are not zone redundant (a null or absent flag reads as off, the ARM default) or run fewer than two instances. Zone redundancy needs a Premium v2 or later or Isolated v2 plan with at least two instances, so a Standard-tier plan is listed because it cannot be zone redundant at all: move it to Premium v3. Zone redundancy can usually be set only when the plan is created, so the fix is a new plan. Scout does not collect the region, so a plan in a region without zones is an exception to record. Free, Shared, Basic and consumption plans are not checked here (see WARA-ASP-01)."
    manual: false

  # ---- Databases and caches (WARA-SQL, WARA-COSMOS, WARA-REDIS, WARA-PGSQL, WARA-MYSQL) -------
  - id: WARA-SQL-01
    title: "WARA-SQL-01. Azure SQL databases are zone redundant"
    severity: high
    aprl: "c0085c32-84c0-c247-bfa9-e70977cbf108"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Sql/servers"
    query: "$.domains.databases.sqlDatabases[?(@.zoneRedundant != true && @.name != 'master')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlDatabases[?(@.name != 'master')]" }
    remediation: "WARA-SQL-01. The databases listed are not zone redundant, so their replicas share one datacenter. Turn zone redundancy on (supported on the General Purpose, Premium, Business Critical and Hyperscale tiers in regions with zones). The master system database is excluded. Scout does not collect the region, so a database in a region without zones is an exception to record."
    manual: false
  - id: WARA-SQL-02
    title: "WARA-SQL-02. Critical SQL databases are replicated to another region (geo-replication or a failover group)"
    severity: high
    aprl: "74c2491d-048b-0041-a140-935960220e20"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Sql/servers"
    # domains.databases.sqlFailoverGroups has one row per server whose failover-group list answered
    # (failoverGroupCount 0 = none). Scout cannot tell a critical database from a test one, so every server is
    # scored, and active geo-replication links (which are not collected) are not seen. Gated on the Measured flag.
    query: "$.domains.databases.sqlFailoverGroups[?(@.failoverGroupCount < 1)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlFailoverGroupsMeasured" }
    remediation: "WARA-SQL-02. The SQL servers listed have no failover group. Put each critical database in a failover group (or give it a readable geo-replica in another region) and have the application connect through the group endpoint. Active geo-replication links are not collected, so a server whose critical databases are protected by links alone, and a server that holds only non-critical databases, are exceptions to record."
    manual: false
  - id: WARA-COSMOS-01
    title: "WARA-COSMOS-01. Cosmos DB accounts span more than one region and use availability zones"
    severity: high
    aprl: "43663217-a1d3-844b-80ea-571a2ce37c6c"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/DocumentDB/databaseAccounts"
    # JSONPath cannot compare two fields, so "zoneRedundantRegionCount < regionCount" cannot be
    # written; the rule flags an account with fewer than two regions or with NO zone-redundant
    # region. An account with some zone-redundant regions and some not is not caught.
    query: "$.domains.databases.cosmosDbAccounts[?(@.regionCount < 2 || @.zoneRedundantRegionCount < 1)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WARA-COSMOS-01. The accounts listed have fewer than two regions, or none of their regions is zone redundant (a location with no flag, or a null count, is read as not redundant, the ARM default). Add a second region and turn zone redundancy on for each region that supports it. Scout cannot compare the two counts per account, so an account with some zone-redundant regions and some not is not listed, and the automatic-failover setting is not scored (a multi-region-write account legitimately reports it off); check both by hand. A region without availability zones is an exception to record."
    manual: false
  - id: WARA-REDIS-01
    title: "WARA-REDIS-01. Production Redis caches are zone redundant (Premium or Enterprise tier)"
    severity: high
    aprl: "5a44bd30-ae6a-4b81-9b68-dc3a8ffca4d8"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Cache/Redis"
    # Enterprise caches carry highAvailability (Enabled / Disabled); classic caches never do. A
    # classic cache (type ends in "redis") is zonal when it lists two or more zones or its
    # zonalAllocationPolicy is Automatic. `A || B && C && D` nests as A || (B && C && D).
    query: "$.domains.databases.redisCaches[?(@.highAvailability =~ /^disabled$/i || @.type =~ /redis$/i && @.zoneCount < 2 && @.zonalAllocationPolicy != 'Automatic')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.redisCaches[*]" }
    remediation: "WARA-REDIS-01. The caches listed are not zone redundant. A classic Azure Cache for Redis is listed when it spans fewer than two zones and its zonal allocation policy is not Automatic (a null policy and a null zone count are read as no zones, the ARM default); only the Premium tier can use zones, so Basic and Standard caches are listed and need a tier change. A Redis Enterprise cache is listed when high availability is Disabled. Zones are set when the cache is created, so the fix is a new cache and a data migration. Scout does not collect the region, so a cache in a region without zones is an exception to record."
    manual: false
  - id: WARA-PGSQL-01
    title: "WARA-PGSQL-01. PostgreSQL flexible servers use zone-redundant high availability"
    severity: high
    aprl: "ca87914f-aac4-4783-ab67-82a6f936f194"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/DBforPostgreSQL/flexibleServers"
    query: "$.domains.databases.postgreSqlFlexibleServers[?(@.haMode != 'ZoneRedundant')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.postgreSqlFlexibleServers[*]" }
    remediation: "WARA-PGSQL-01. The servers listed do not run zone-redundant high availability: the mode is Disabled or SameZone, or it is null or empty, which ARM treats as Disabled. Turn on zone-redundant HA so a standby replica is kept in another zone (the Burstable tier cannot use HA, so those servers need a tier change first). Scout does not collect the region, so a server in a region without zones is an exception to record. Geo-redundant backup and a cross-region read replica are not scored here; confirm them where the recovery target needs them."
    manual: false
  - id: WARA-MYSQL-01
    title: "WARA-MYSQL-01. MySQL flexible servers use zone-redundant high availability"
    severity: high
    aprl: "88856605-53d8-4bbd-a75b-4a7b14939d32"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/DBforMySQL/flexibleServers"
    query: "$.domains.databases.mySqlFlexibleServers[?(@.haMode != 'ZoneRedundant')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.mySqlFlexibleServers[*]" }
    remediation: "WARA-MYSQL-01. The servers listed do not run zone-redundant high availability: the mode is Disabled or SameZone, or it is null or empty, which ARM treats as Disabled. Turn on zone-redundant HA so a standby replica is kept in another zone (the Burstable tier cannot use HA, so those servers need a tier change first). Scout does not collect the region, so a server in a region without zones is an exception to record. Geo-redundant backup and a cross-region read replica are not scored here; confirm them where the recovery target needs them."
    manual: false

  # ---- Storage and Key Vault (WARA-STG, WARA-KV) ----------------------------------------------
  - id: WARA-STG-01
    title: "WARA-STG-01. Storage accounts use zone or geo redundancy, not locally redundant storage"
    severity: high
    aprl: "e6c7e1cc-2f47-264d-aa50-1da421314472"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Storage/storageAccounts"
    query: "$.domains.storage.storageAccounts[?(@.sku =~ /_LRS$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WARA-STG-01. The accounts listed are locally redundant (LRS), so all copies sit in one datacenter. Change to ZRS, GRS or GZRS (and RA- variants where reads must survive a region loss). Accounts holding only rebuildable data, such as scratch or diagnostic output, can stay LRS."
    manual: false
  - id: WARA-KV-01
    title: "WARA-KV-01. Key Vault soft delete is on"
    severity: high
    aprl: "1cca00d2-d9ab-8e42-a788-5d40f49405cb"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/KeyVault/vaults"
    # Soft delete is mandatory on every vault created today and the property is omitted on new
    # vaults, so only an explicit false is a finding; null/absent reads as on.
    query: "$.domains.security.keyVaults[?(@.softDelete == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.security.keyVaults[*]" }
    remediation: "WARA-KV-01. The vaults listed have soft delete explicitly off, so a deleted vault or secret cannot be recovered. Turn it on; it cannot be turned off again once enabled."
    manual: false
  - id: WARA-KV-02
    title: "WARA-KV-02. Key Vault purge protection is on"
    severity: medium
    aprl: "70fcfe6d-00e9-5544-a63a-fff42b9f2edb"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/KeyVault/vaults"
    query: "$.domains.security.keyVaults[?(@.purgeProtection != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.security.keyVaults[*]" }
    remediation: "WARA-KV-02. The vaults listed do not have purge protection, so someone with access can permanently erase a soft-deleted vault or secret before the retention period ends. Enable purge protection (it cannot be disabled afterwards), after confirming the vault name will not need re-using inside the retention window."
    manual: false

  # ---- Backup vaults (WARA-RSV) ---------------------------------------------------------------
  # Both rules read `$.management.recoveryVaults`, which the single-pass inventory shapes from the
  # ordinary resources table (softDelete, storageType and crossRegion are string-valued there).
  - id: WARA-RSV-01
    title: "WARA-RSV-01. Recovery Services vault soft delete is not disabled"
    severity: medium
    aprl: "9e39919b-78af-4a0b-b70f-c548dae97c25"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/RecoveryServices/vaults"
    query: "$.management.recoveryVaults[?(@.softDelete =~ /^disabled$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.management.recoveryVaults[*]" }
    remediation: "WARA-RSV-01. The vaults listed have soft delete for backups turned off, so a deleted or tampered backup is gone at once. Set the vault's soft delete state to Enabled (or Always-on) so deleted backups stay recoverable for the retention period."
    manual: false
  - id: WARA-RSV-02
    title: "WARA-RSV-02. Geo-redundant backup vaults have cross-region restore enabled"
    severity: medium
    aprl: "1549b91f-2ea0-4d4f-ba2a-4596becbe3de"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/RecoveryServices/vaults"
    query: "$.management.recoveryVaults[?(@.storageType =~ /^geo/i && @.crossRegion =~ /^false$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.management.recoveryVaults[?(@.storageType =~ /^geo/i)]" }
    remediation: "WARA-RSV-02. The vaults listed keep geo-redundant backups but have cross-region restore off, so backups replicated to the paired region cannot be restored there unless Microsoft declares a disaster. Turn cross-region restore on so you can restore in the paired region on demand."
    manual: false

  # ---- Networking (WARA-LB, WARA-AGW, WARA-VPN, WARA-ER, WARA-FW) -----------------------------
  - id: WARA-LB-01
    title: "WARA-LB-01. Load balancers use the Standard SKU"
    severity: high
    aprl: "38c3bca1-97a1-eb42-8cd3-838b243f35ba"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/loadBalancers"
    query: "$.networking.loadBalancers[?(@.sku =~ /^basic$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.loadBalancers[*]" }
    remediation: "WARA-LB-01. The load balancers listed are Basic, which has no availability-zone support and no SLA, and Microsoft has retired it. Migrate them to Standard with the Basic-to-Standard upgrade guidance, then make the frontends zone redundant."
    manual: false
  - id: WARA-LB-02
    title: "WARA-LB-02. Standard load balancer frontends are zone redundant"
    severity: high
    aprl: "621dbc78-3745-4d32-8eac-9e65b27b7512"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/loadBalancers"
    # minFrontendZoneCount is the WEAKEST frontend's zone count (0 for a frontend with no zones, and
    # for a load balancer with no frontends), so one weak frontend is enough to list the balancer.
    query: "$.networking.loadBalancers[?(@.sku =~ /^standard$/i && @.minFrontendZoneCount < 2)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.loadBalancers[?(@.sku =~ /^standard$/i)]" }
    remediation: "WARA-LB-02. The Standard load balancers listed have at least one frontend that lists fewer than two zones (a null count reads as none). Make every frontend zone redundant. Internal frontends carry their zones on the frontend itself, so for them this is a reliable signal. A public frontend takes its zones from its public IP address, so for a load balancer with a public frontend confirm the public IP is zone redundant (WARA-PIP-01) before acting: a zone-redundant public IP behind a balancer listed here is a false positive to record as an exception. A region without availability zones is an exception too, as Scout does not collect whether it has zones. Basic load balancers are not checked (see WARA-LB-01)."
    manual: false
  - id: WARA-PIP-01
    title: "WARA-PIP-01. Standard public IP addresses are zone redundant"
    severity: high
    aprl: "c63b81fb-7afc-894c-a840-91bb8a8dcfaf"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/publicIPAddresses"
    # APRL asks for all three zones; Scout asks for at least two so a two-zone region is not failed.
    # 0 and null both match; null is a Standard address with no zones array.
    query: "$.networking.publicIPAddresses[?(@.skuName =~ /^standard$/i && @.zoneCount < 2)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.publicIPAddresses[?(@.skuName =~ /^standard$/i)]" }
    remediation: "WARA-PIP-01. The Standard public IP addresses listed span fewer than two availability zones (a null zone count reads as no zones, which is how a non-zonal address is stored). A zonal address is tied to one zone and a non-zonal one has no zone guarantee, so a zone failure can take down whatever it fronts. Zones cannot be changed on an existing address: create a zone-redundant one and move the association. Scout does not collect whether the region has zones, so an address in a region without them is an exception to record. Basic addresses are not checked here (see WARA-PIP-02)."
    manual: false
  - id: WARA-PIP-02
    title: "WARA-PIP-02. No public IP address uses the Basic SKU"
    severity: medium
    aprl: "5cea1501-6fe4-4ec4-ac8f-f72320eb18d3"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/publicIPAddresses"
    query: "$.networking.publicIPAddresses[?(@.skuName =~ /^basic$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.publicIPAddresses[*]" }
    remediation: "WARA-PIP-02. The public IP addresses listed use the Basic SKU, which has no availability-zone support and is open to inbound traffic by default; Microsoft has retired it. Upgrade each to Standard (a dynamic address has to be made static first) and then make it zone redundant (WARA-PIP-01)."
    manual: false
  - id: WARA-AGW-01
    title: "WARA-AGW-01. Application gateways use the v2 SKU"
    severity: high
    aprl: "7893f0b3-8622-1d47-beed-4b50a19f7895"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/applicationGateways"
    query: "$.networking.applicationGateways[?(@.tier =~ /^(Standard|WAF)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.applicationGateways[*]" }
    remediation: "WARA-AGW-01. The gateways listed are the v1 SKU (Standard or WAF tier). Application Gateway v1 reached retirement on 28 April 2026 with no SLA, so traffic through it is not guaranteed. Migrate to Standard v2 or WAF v2, which add autoscale, zone redundancy and a static address."
    manual: false
  - id: WARA-AGW-02
    title: "WARA-AGW-02. Application gateways span availability zones and autoscale"
    severity: high
    aprl: "c9c00f2a-3888-714b-a72b-b4c9e8fcffb2"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/applicationGateways"
    query: "$.networking.applicationGateways[?(@.zoneCount < 2 || @.autoscaleMax == null)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.applicationGateways[*]" }
    remediation: "WARA-AGW-02. The gateways listed span fewer than two availability zones (a null zone count reads as no zones) or have no autoscale configuration (a fixed instance count). Zones can only be chosen when the gateway is created, so the fix is a new v2 gateway across all the region's zones, with autoscale and a minimum instance count that covers the loss of a zone. The v1 gateways flagged by WARA-AGW-01 appear here too, because v1 supports neither. Scout does not collect whether the region has zones, so a gateway in a region without zones is an exception to record."
    manual: false
  - id: WARA-VPN-01
    title: "WARA-VPN-01. VPN gateways use zone-redundant (AZ) SKUs"
    severity: high
    aprl: "5b1933a6-90e4-f642-a01f-e58594e5aab2"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/virtualNetworkGateways"
    query: "$.networking.vpnGateways[?(@.gatewayType =~ /^vpn$/i && @.sku =~ /^(Basic|Standard|HighPerformance|VpnGw1|VpnGw2|VpnGw3|VpnGw4|VpnGw5)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.vpnGateways[?(@.gatewayType =~ /^vpn$/i)]" }
    remediation: "WARA-VPN-01. The VPN gateways listed are on a SKU without AZ in its name (Basic, legacy Standard or High Performance, or non-AZ VpnGw1-5). Those SKUs are not zone redundant and the non-AZ VpnGw SKUs retire on 30 September 2026. Resize to the matching AZ SKU, with a Standard public IP."
    manual: false
  - id: WARA-VPN-02
    title: "WARA-VPN-02. VPN gateways run in active-active mode"
    severity: medium
    aprl: "281a2713-c0e0-3c48-b596-19f590c46671"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/virtualNetworkGateways"
    query: "$.networking.vpnGateways[?(@.gatewayType =~ /^vpn$/i && @.sku != 'Basic' && @.activeActive != true)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.vpnGateways[?(@.gatewayType =~ /^vpn$/i)]" }
    remediation: "WARA-VPN-02. The VPN gateways listed run active-standby, so a maintenance event or failure drops the tunnels until the standby takes over. Enable active-active (two gateway IPs, two tunnels per site) and make the on-premises device accept both."
    manual: false
  - id: WARA-ER-01
    title: "WARA-ER-01. ExpressRoute gateways use zone-redundant (AZ) SKUs"
    severity: high
    aprl: "bbe668b7-eb5c-c746-8b82-70afdedf0cae"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/virtualNetworkGateways"
    query: "$.networking.vpnGateways[?(@.gatewayType =~ /^expressroute$/i && @.sku =~ /^(Basic|Standard|HighPerformance|UltraPerformance)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.vpnGateways[?(@.gatewayType =~ /^expressroute$/i)]" }
    remediation: "WARA-ER-01. The ExpressRoute gateways listed are on a non-zone-redundant SKU (Basic, Standard, High Performance or Ultra Performance). Move to ErGw1AZ, ErGw2AZ, ErGw3AZ or ErGwScale so the gateway spreads across zones."
    manual: false
  - id: WARA-ER-02
    title: "WARA-ER-02. ExpressRoute connectivity uses two circuits at different peering locations"
    severity: high
    aprl: "4d703025-dafc-f840-a183-5dc440456134"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/expressRouteCircuits"
    query: "$.networking.expressRouteCircuits[*]"
    assert: { type: manual, gate: "$.networking.expressRouteCircuits[*]" }
    remediation: "WARA-ER-02. Which circuit connects to which gateway is not collected, so every circuit is attached with its provider and peering location. Confirm each virtual network gateway connects to two circuits at different peering locations, with both links active-active."
    manual: true
  - id: WARA-FW-01
    title: "WARA-FW-01. Azure Firewalls are deployed across availability zones"
    severity: high
    aprl: "c72b7fee-1fa0-5b4b-98e5-54bcae95bb74"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/Network/azureFirewalls"
    query: "$.networking.azureFirewalls[?(@.zoneCount < 2)]"
    assert: { type: countEquals, value: 0, gate: "$.networking.azureFirewalls[*]" }
    remediation: "WARA-FW-01. The firewalls listed span fewer than two availability zones (a null zone count reads as no zones). Zones can only be set when the firewall is created, so the fix means redeploying it across all the region's zones. Scout does not collect the firewall region, so a firewall in a region without zones is an exception to record."
    manual: false

  # ---- Integration and messaging (WARA-APIM, WARA-EH) -----------------------------------------
  - id: WARA-APIM-01
    title: "WARA-APIM-01. API Management instances that need zone redundancy are on the Premium tier"
    severity: medium
    aprl: "baf3bfc0-32a2-4c0c-926d-c9bf0b49808e"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/ApiManagement/service"
    query: "$.domains.integration.apiManagement[?(@.sku =~ /^(Developer|Basic|Standard)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.integration.apiManagement[*]" }
    remediation: "WARA-APIM-01. The instances listed are Developer, Basic or Standard. The Developer tier has no SLA, and none of these three can spread across availability zones or add regions. Use Premium for production APIs that must survive a datacenter loss; a non-production instance can stay as it is."
    manual: false
  - id: WARA-EH-01
    title: "WARA-EH-01. Event Hubs namespaces are zone redundant"
    severity: high
    aprl: "84636c6c-b317-4722-b603-7b1ffc16384b"
    source: "https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/tree/main/azure-resources/EventHub/namespaces"
    query: "$.domains.integration.eventHubNamespaces[?(@.zoneRedundant != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.integration.eventHubNamespaces[*]" }
    remediation: "WARA-EH-01. The namespaces listed are not zone redundant. Zone redundancy is on by default for new namespaces in regions with zones, but templates can switch it off and older namespaces may predate it. Scout does not collect the region, so a namespace in a region without zones is an exception to record."
    manual: false
