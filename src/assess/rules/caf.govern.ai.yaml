area: "Artificial Intelligence"
framework: "Cloud Governance"
weight: 0.142857
frameworkversion: "CAF Govern (learn.microsoft.com/azure/cloud-adoption-framework/govern), AI category per docs/frameworks/cloud-governance-question-set.md, verified 2026-08-01"
rules:
  - id: CGOV-AI-01
    title: "AI system outputs are monitored — abuse monitoring and content filtering configured"
    severity: high
    # No AI Foundry / content-filter configuration ingest exists in collect.json --
    # domains.ai.cognitiveAccounts records that a Cognitive Services account exists, not its
    # content-filter or abuse-monitoring configuration.
    query: null
    assert: { type: manual }
    remediation: "Confirm abuse monitoring and content filtering are configured on AI Foundry / Azure OpenAI deployments -- Scout does not currently collect this configuration."
    # AB#6853 — the gap register needs the condition that CLOSES the gap (targetState),
    # not only the action (remediation); the roadmap needs an accountable owner, a
    # T-shirt effort and the 30-day phase the action belongs to.
    targetState: "Abuse monitoring and content filtering configured on every Azure OpenAI / AI Foundry deployment"
    owner: "AI Platform / Security Engineering"
    effort: M
    phase: 2
    manual: true

  - id: CGOV-AI-02
    title: "Customer-facing AI systems are red-teamed on a recurring cadence"
    severity: medium
    # Organisational/process fact -- no Azure artifact records a red-team cadence.
    query: null
    assert: { type: manual }
    remediation: "Confirm customer-facing AI systems are red-teamed on a recurring cadence. This is a process control with no Azure resource artifact for Scout to read."
    # AB#6853 — the gap register needs the condition that CLOSES the gap (targetState),
    # not only the action (remediation); the roadmap needs an accountable owner, a
    # T-shirt effort and the 30-day phase the action belongs to.
    targetState: "Customer-facing AI systems red-teamed on a documented recurring cadence"
    owner: "Security Engineering"
    effort: L
    phase: 3
    manual: true
