area: "Resource organization"
framework: CAF
# AB#6797 design-area weighting -- see docs/design/caf-design-area-weighting.md.
# 35 / 45.625 = 0.77.
weight: 0.77
frameworkversion: "CAF landing zone design area: Resource organization, learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org, verified 2026-08-01"
rules:
  - id: CAF-RES-01
    title: "Subscriptions tagged with owner/environment"
    severity: medium
    query: "$.subscriptions[?(@.tags.Environment)]"
    assert: { type: exists }
    remediation: "Apply a consistent tagging taxonomy (Environment, Owner, CostCenter) across subscriptions."
    manual: false

  - id: CAF-RES-02
    title: "Management group hierarchy beyond the tenant root"
    severity: high
    query: "$.governance.managementGroups[*]"
    assert: { type: countGreaterThan, value: 1 }
    remediation: "Build an intermediate management-group hierarchy per the ALZ archetype."
    manual: false

  - id: CAF-RES-03
    title: "Consistent tag values per key across subscriptions"
    severity: low
    query: "$.tags[*]"
    assert: { type: exists }
    remediation: "Normalize tag values to reduce sprawl and enable reliable cost allocation."
    manual: false

  # AB#9300, depth wiring. A subscription's own Resource Graph row carries its management group chain
  # (properties.managementGroupAncestorsChain), projected as `managementGroupLevels`: 1 means the tenant root group is
  # the only ancestor, i.e. the subscription sits directly under the root, which is where Azure puts a new subscription
  # until someone moves it. The gate is a subscription whose chain was read, so a tenant whose chain could not be
  # read is Not assessed, never a pass.
  - id: CAF-RES-04
    title: "CAF-RES-04. Every subscription is assigned to a management group"
    severity: high
    query: "$.subscriptions[?(@.managementGroupLevels == 1)]"
    assert: { type: countEquals, value: 0, gate: "$.subscriptions[?(@.managementGroupLevels >= 1)]" }
    remediation: "CAF-RES-04. The subscriptions listed sit directly under the tenant root management group, so no management group's policy, role assignments or budget scope reaches them by design. Move each into a management group that matches its landing zone or archetype (platform, landing zones, sandbox, decommissioned)."
    manual: false

  - id: CAF-RES-05
    title: "Resource and resource-group names follow a documented naming convention"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm names follow the CAF naming pattern (resourceType-workload-env-region-instance). No naming-pattern signal is currently collected."
    manual: true

  - id: CAF-RES-06
    title: "Environment tag coverage across subscriptions meets threshold"
    severity: medium
    query: "$.subscriptions[?(@.tags.Environment)]"
    assert: { type: percentageAtLeast, value: 80, denominatorQuery: "$.subscriptions[*]" }
    remediation: "Apply the Environment tag to at least 80% of subscriptions to support reliable cost allocation and policy scoping."
    manual: false
