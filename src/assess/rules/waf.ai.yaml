  # ---- AI architecture pattern (WAF-AI-ARCH) -- Scout-derived ------------------------------
  # Source: https://learn.microsoft.com/azure/well-architected/ai/architecture-pattern
  - id: WAF-AI-ARCH-01
    title: "WAF-AI-ARCH-01. Machine learning workspaces are not publicly reachable"
    severity: high
    query: "$.domains.ai.mlWorkspaces[?(@.publicAccess == 'Enabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.mlWorkspaces[*]" }
    remediation: "WAF-AI-ARCH-01. The workspaces listed allow public network access. Only the intelligence API should be exposed; disable public access and use private endpoints for the training platform."
    manual: false
  - id: WAF-AI-ARCH-02
    title: "WAF-AI-ARCH-02. The training platform is network-isolated (managed virtual network)"
    severity: medium
    query: "$.domains.ai.mlWorkspaces[?(@.isolationMode != 'AllowOnlyApprovedOutbound' && @.isolationMode != 'AllowInternetOutbound')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.mlWorkspaces[*]" }
    remediation: "WAF-AI-ARCH-02. The workspaces listed have no managed virtual network. Enable managed network isolation, preferably 'Allow only approved outbound'."
    manual: false
  - id: WAF-AI-ARCH-03
    title: "WAF-AI-ARCH-03. High-risk agent actions need human approval"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WAF-AI-ARCH-03. Confirm tool actions with real-world impact (payments, deletions, external messages) require a person to approve them."
    manual: true
  - id: WAF-AI-ARCH-04
    title: "WAF-AI-ARCH-04. The model registry is a governance gate before production"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AI-ARCH-04. Confirm models reach production only through a registry that records checksums, lineage and a responsible-AI review."
    manual: true
  - id: WAF-AI-ARCH-05
    title: "WAF-AI-ARCH-05. AI service accounts require Entra ID authentication (local keys disabled)"
    severity: high
    query: "$.domains.ai.cognitiveAccounts[?(@.disableLocalAuth != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.ai.cognitiveAccounts[*]" }
    remediation: "WAF-AI-ARCH-05. The AI accounts listed still accept API keys. Set disableLocalAuth to true and use managed identities with role-based access."
    manual: false