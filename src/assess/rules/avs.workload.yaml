area: "Azure VMware Solution workload (Reliability, Security, Governance)"
# AB#9300, 3.18.19. Resource Graph indexes a private cloud but not its children, so the clusters,
# datastores, placement policies, add-ons, Global Reach connections, authorizations, cloud links, NSX
# workload network, iSCSI paths and maintenances are now read from the Microsoft.AVS provider
# (domains.avs, each dataset with a ...Measured flag) and the private cloud's own extended properties
# (customer-managed key state, a second zone, a virtual network id) are projected. Items they answer
# are automated and gated on the dataset's Measured flag -- NotAssessed, never Fail, when a list could
# not be read: RE-05 (every cluster, stretched-aware), SEC-05 (customer-managed key), SEC-07 (VMware
# syslog diagnostic setting). RE-06 and RE-08 stay manual and carry what was read as evidence.
# AB#6820 (Feature AB#6748, Epic AB#6454). framework: AVS, not WAF -- deliberately. Every rule
# here cites a WAF-AVS-* item from docs/frameworks/waf-avs-workload-checklist.md, and that file
# says plainly (read it before touching this one) that no Microsoft-published WAF pillar service
# guide exists for AVS: the enumeration is built from the Reliability doc series plus a CAF
# Security/Governance scenario guide, and there is NO Cost Optimization, Operational Excellence,
# or Performance Efficiency source for this workload at all. Filing these rules under
# framework: WAF with area: Reliability/Security would claim WAF-pillar coverage this workload
# does not have, and would violate the restructure gate's "no sixth pillar" rule the same way
# waf.storage.yaml did (AB#6798) -- three pillars is not five pillars. AVS joins SMART and XR as
# a Scout-internal scoring axis exempt from the WAF/CAF pillar gate
# (tests/Assessment.Restructure.Tests.ps1's `default { }` branch), which is the honest framing:
# "Reliability, Security, and Governance coverage for AVS," not "the AVS Well-Architected Review."
framework: AVS
frameworkversion: "docs/frameworks/waf-avs-workload-checklist.md, extracted 2026-08-01 (Reliability in Azure VMware Solution + CAF Security/governance/compliance scenario guide, both fetched in full 2026-08-01)"
weight: 1.0
verifiedAgainst: "docs/frameworks/waf-avs-workload-checklist.md, 27 items across Reliability (8) / Security (11) / Governance (8), extracted 2026-08-01"
# This whole framework only applies to an estate that actually runs Azure VMware Solution. Without
# this gate, every countEquals-0 / notExists-style rule below would report a clean Pass on an
# estate with ZERO private clouds -- indistinguishable from an estate that runs a fleet of them
# with every offending property fixed. "no AVS private cloud in scope" and "AVS is deployed and
# fully compliant" are the same collected row count and opposite findings; smart.migration.yaml
# established this pattern first (AB#6832) for the same reason.
requires:
  - path: "$.compute.privateClouds[*]"
    description: "Azure VMware Solution private clouds (Compute/VMWare, Microsoft.AVS/privateClouds)"
rules:
  # ---- Reliability (WAF-AVS-RE-01..08) ---------------------------------------------------------
  - id: WAF-AVS-RE-01
    title: "WAF-AVS-RE-01. vSphere HA restarts VMs on healthy hosts after a host failure"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-RE-01. vSphere HA configuration is internal vCenter state, not exposed via ARM/ARG -- confirm HA is enabled and its admission-control policy is sized for the cluster in vCenter directly."
    manual: true
  - id: WAF-AVS-RE-02
    title: "WAF-AVS-RE-02. vSAN fault-tolerance policies protect against storage-level transient faults"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-RE-02. vSAN storage-policy configuration lives inside the private cloud and is not ARM-readable -- confirm FTT/RAID policy in vCenter."
    manual: true
  - id: WAF-AVS-RE-03
    title: "WAF-AVS-RE-03. Applications handle transient faults with retry/circuit-breaker patterns"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-RE-03. An application-code pattern -- no control-plane signal can evidence it. Review guest workload resiliency patterns directly."
    manual: true
  - id: WAF-AVS-RE-04
    title: "WAF-AVS-RE-04. Private cloud uses a zonal or stretched-cluster deployment for AZ resilience"
    severity: high
    # properties.availability.strategy (documented AVS PrivateCloud property; SingleZone /
    # DualZone / None) is an ARM property on the private-cloud resource itself, unlike almost
    # everything else this checklist cites.
    query: "$.compute.privateClouds[?(@.availabilityStrategy == 'None' || @.availabilityStrategy == '')]"
    assert: { type: countEquals, value: 0 }
    remediation: "WAF-AVS-RE-04. Each listed private cloud has no availability-zone strategy configured (availability.strategy is None/empty). Deploy into a zone-aware or stretched-cluster configuration where the region supports it."
    manual: false
  - id: WAF-AVS-RE-05
    title: "WAF-AVS-RE-05. Every cluster meets the minimum host count for its availability configuration"
    severity: medium
    # AB#9300, 3.18.19. This used to check only the management cluster's size against the absolute
    # floor of 3, because the private cloud's own Resource Graph row is all Scout could see. The
    # clusters list (Microsoft.AVS/privateClouds/clusters) is now read, so the rule covers EVERY
    # cluster and holds each to the minimum for its private cloud's availability strategy: 3 hosts,
    # or 6 (three per zone) when the strategy is DualZone -- the resiliency-specific minimum the
    # checklist item names (Reliability in Azure VMware Solution; Design vSAN stretched clusters).
    # domains.avs.clusters[].minimumHosts and belowMinimumHosts carry that arithmetic; a cluster with
    # no size reads null and is not flagged. Gated on the Measured flag: if the cluster list could not
    # be read the rule is NotAssessed, never a Pass.
    query: "$.domains.avs.clusters[?(@.belowMinimumHosts == true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.avs.clustersMeasured" }
    remediation: "WAF-AVS-RE-05. Each listed cluster has fewer hosts than its private cloud's availability configuration needs: 3 for a standard cluster (the Azure-wide floor), 6 for a stretched (DualZone) private cloud -- three hosts in each availability zone, scaled in pairs. Scale the cluster out; below its minimum it is not a supported configuration and, for a stretched cloud, falls outside the 99.99 percent availability commitment. The check covers every cluster of every private cloud, not only the management cluster."
    manual: false
  - id: WAF-AVS-RE-06
    title: "WAF-AVS-RE-06. Multi-region resilience via separate, deliberately-paired private clouds"
    severity: low
    # Evidence only (AB#9300, 3.18.19): the private clouds that have a replication add-on, Site Recovery
    # Manager or vSphere Replication, provisioned. Which private clouds are PAIRED across regions, and
    # whether a failover runbook exists, is a design decision no control-plane field records.
    query: "$.domains.avs.addons[?(@.srmEnabled == true || @.vrEnabled == true)]"
    assert: { type: manual }
    remediation: "WAF-AVS-RE-06. The private clouds listed as evidence have a Site Recovery Manager or vSphere Replication add-on provisioned -- the platform half of a VMware DR design; compute.privateClouds[*] shows how many private clouds exist and where. Neither shows whether two private clouds are deliberately paired as a documented DR solution -- confirm the pairing, the protection groups and the failover runbook exist where business requirements need multi-region resilience."
    manual: true
  - id: WAF-AVS-RE-07
    title: "WAF-AVS-RE-07. Management-component and workload VM backups are both in place"
    severity: high
    # WAF-AVS-SEC-08 records the same underlying discrepancy: the checklist's own collector column
    # names Management/RecoveryVault and Management/BackupInstances, but collect.json's
    # management.recoveryVaults is a hard-coded empty array (Invoke-Collect.ps1) -- already true of
    # the two PRE-EXISTING rules that read it (WAF-RE-09, caf.management.yaml) before this story
    # touched anything, and out of this story's scope to fix. Scoring against a field this codebase
    # already knows never returns rows would be exactly the empty-collection false-pass class this
    # epic exists to kill, so this stays manual rather than citing a query that cannot fail.
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-RE-07. Management-component (vCenter Server, NSX Manager, HCX Manager) backup is Microsoft-managed and not customer-configurable to evidence here. Workload VM backup would be visible via Azure Backup Recovery Services vaults, but collect.json's management.recoveryVaults field is not populated by any current collection path -- confirm both backup halves directly in the Backup center / Recovery Services vault."
    manual: true
  - id: WAF-AVS-RE-08
    title: "WAF-AVS-RE-08. Maintenance windows configured to reduce production impact"
    severity: low
    # Evidence only (AB#9300, 3.18.19): the platform maintenance each private cloud has pending or has
    # just had -- component (ESXi, vCenter, NSX-T), state, whether Microsoft scheduled it, its start
    # time and readiness. Whether the time chosen reduces production impact is a business judgement.
    query: "$.domains.avs.maintenances[*]"
    assert: { type: manual }
    remediation: "WAF-AVS-RE-08. The maintenance listed as evidence (component, state, scheduled time, whether Microsoft or the customer scheduled it) is what the platform has pending; an empty list means none was pending when Scout read it, not that a window is configured. Whether the schedule avoids production peaks is a business judgement -- confirm maintenance is scheduled into a window that suits the workloads, and reschedule anything still on Microsoft's default time."
    manual: true

  # ---- Security (WAF-AVS-SEC-01..11) -------------------------------------------------------------
  - id: WAF-AVS-SEC-01
    title: "WAF-AVS-SEC-01. Permanent Contributor access to the AVS resource group is limited"
    severity: high
    # Evidence only: permanent, standing Contributor assignments anywhere in the estate (Azure RBAC
    # role assignment schedules). Scout cannot tell which of them is scoped to the AVS resource
    # group, so the reviewer picks those out by scope; empty when the schedules were not read.
    query: "$.governance.roleAssignmentSchedules[?(@.accessType == 'Standing' && @.permanent == true && @.roleDefinitionName == 'Contributor')]"
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-01. The permanent, standing Contributor assignments are listed as evidence (estate-wide -- find those at or above the AVS resource group by scope). Confirm Contributor access to the AVS resource group is PIM-eligible, time-bound and justification-based, not standing; governance.pimEligibility lists the eligible assignments."
    manual: true
  - id: WAF-AVS-SEC-02
    title: "WAF-AVS-SEC-02. cloudadmin/network-admin built-in accounts used only in break-glass scenarios"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-02. vCenter/NSX-T-internal RBAC configuration is not ARM-readable -- confirm cloudadmin/network-admin usage is centrally managed and domain-services-sourced accounts are used for routine access."
    manual: true
  - id: WAF-AVS-SEC-03
    title: "WAF-AVS-SEC-03. Guest VM identity uses centralized AD DS/LDAP integrated with Microsoft Entra ID"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-03. Guest-VM domain-join state inside the private cloud is not collected. Confirm guest VMs authenticate against a centralized AD DS/LDAP source integrated with Microsoft Entra ID."
    manual: true
  - id: WAF-AVS-SEC-04
    title: "WAF-AVS-SEC-04. Network security controls are implemented for AVS traffic"
    severity: high
    # Evidences the Azure-side half only (an Azure Firewall exists somewhere in scope) -- NSX-T
    # internal micro-segmentation, WAF/OWASP policy attachment, and DDoS protection plan
    # assignment are not fields Invoke-Collect projects, so this is existence evidence, not a
    # full control review.
    query: "$.networking.azureFirewalls[*]"
    assert: { type: exists }
    remediation: "WAF-AVS-SEC-04. No Azure Firewall was found in scope, so there is no Azure-side traffic-inspection control to evidence. This checks Azure-side existence only -- NSX-T-internal filtering, WAF/OWASP compliance, and DDoS protection plan assignment still need direct verification."
    manual: false
  - id: WAF-AVS-SEC-05
    title: "WAF-AVS-SEC-05. vSAN datastores use customer-managed key (CMK) encryption via Key Vault"
    severity: medium
    # AB#9300, 3.18.19. This item was dropped earlier as unanswerable ("needs the keys inside a Key
    # Vault, which AzureScout never reads"). That reasoning mistook what the item asks. Whether the
    # private cloud's vSAN datastore uses a customer-managed key is a property of the PRIVATE CLOUD
    # (properties.encryption.status, Enabled or Disabled), and the health of the connection to the key
    # is reported by the Azure VMware Solution provider itself (encryption.keyVaultProperties.keyState,
    # Connected or AccessDenied). Both are in the private cloud's own Resource Graph row, so nothing
    # inside a Key Vault is read -- not a key, not a version, not the vault's URL. A private cloud on
    # platform-managed encryption, or whose key the platform cannot reach, is flagged.
    query: "$.compute.privateClouds[?(@.encryptionStatus == 'Disabled' || @.encryptionStatus == '' || @.encryptionKeyState == 'AccessDenied')]"
    assert: { type: countEquals, value: 0 }
    remediation: "WAF-AVS-SEC-05. Each listed private cloud either does not use customer-managed encryption keys for its vSAN datastore (encryption is Disabled or not configured) or cannot reach the key it is configured with (key state AccessDenied). Configure customer-managed keys from Azure Key Vault where your data-protection requirements call for them -- the private cloud needs a system-assigned identity with get, wrap key and unwrap key permissions on the key -- and restore the identity's access to a key reported as AccessDenied (check the key has not expired or been deleted): a private cloud that lost access to its key cannot perform some cluster modification operations. Only the encryption state and key-connection state are read; the key, its version and the vault are never read."
    manual: false
  - id: WAF-AVS-SEC-06
    title: "WAF-AVS-SEC-06. vCenter Server access is via a dedicated privileged access workstation"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-06. An access-pattern practice with no control-plane signal -- confirm vCenter Server administration happens from a dedicated PAW."
    manual: true
  - id: WAF-AVS-SEC-07
    title: "WAF-AVS-SEC-07. Inbound/outbound guest traffic is logged and monitored"
    severity: medium
    # AB#9300, 3.18.19. This used to evidence only that a Log Analytics workspace exists somewhere. A
    # private cloud forwards its VMware syslog -- vCenter, ESXi, vSAN, NSX Manager, NSX distributed and
    # gateway firewall and NSX edge logs, the records of guest traffic crossing the NSX firewalls --
    # through a DIAGNOSTIC SETTING on the private cloud (log category vmwaresyslog, Configure VMware
    # syslogs for Azure VMware Solution). The diagnostic-settings sweep now includes
    # microsoft.avs/privateclouds, so opsPosture.diagnosticCoverage has a row for it: how many private
    # clouds there are and how many have a setting. A private cloud with no setting forwards nothing.
    # Gated on that row: a run whose sweep did not read a private cloud is NotAssessed. The coverage is
    # "has a setting", not "to which destination" or "with which NSX firewall rules logging" -- those stay
    # for the reviewer, and the remediation says so.
    query: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.avs/privateclouds' && @.coveragePct < 100)]"
    assert: { type: countEquals, value: 0, gate: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.avs/privateclouds')]" }
    remediation: "WAF-AVS-SEC-07. Not every private cloud streams its VMware syslog (vCenter, ESXi, NSX firewall and edge logs) to a destination: the coverage row lists how many have no diagnostic setting. Add a diagnostic setting with the vmwaresyslog category to a Log Analytics workspace or Microsoft Sentinel workspace (the built-in policy that deploys it to every private cloud enforces this at scale). Having a setting does not prove NSX distributed and gateway firewall rules have logging switched on, or that the destination is the SIEM your security team watches -- confirm both directly."
    manual: false
  - id: WAF-AVS-SEC-08
    title: "WAF-AVS-SEC-08. Backups are centrally managed with RBAC and soft-delete protection"
    severity: high
    # See WAF-AVS-RE-07's note: management.recoveryVaults is a hard-coded empty field in
    # collect.json, so this cannot be automated without citing a query that can never return rows.
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-08. collect.json does not carry Recovery Services vault soft-delete state or RBAC scoping (management.recoveryVaults is not populated by any current collection path). Confirm backups are centrally managed with RBAC and delayed-delete/soft-delete protection directly in the Backup center."
    manual: true
  - id: WAF-AVS-SEC-09
    title: "WAF-AVS-SEC-09. Guest VMs use advanced threat detection"
    severity: medium
    # Evidences Arc onboarding (a prerequisite for Defender for Servers on non-Azure/guest VMs),
    # not Defender for Cloud plan assignment itself -- security.defenderPlans (populated per
    # subscription since AB#6903) is tenant-wide plan state and cannot prove the plan covers
    # these specific guest VMs, so plan-level confirmation stays manual.
    query: "$.domains.hybrid.arcServers[*]"
    assert: { type: exists }
    remediation: "WAF-AVS-SEC-09. No Arc-onboarded server was found in scope. Arc onboarding is the prerequisite for Defender for Servers coverage on AVS guest VMs -- finding Arc servers is not proof Defender for Cloud's server plan covers them (security.defenderPlans records subscription-level plan tiers, not per-VM coverage); confirm plan assignment directly."
    manual: false
  - id: WAF-AVS-SEC-10
    title: "WAF-AVS-SEC-10. Guest VM OS and database encryption enabled where sensitivity requires it"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-10. Guest-OS-level encryption state is not ARM-readable -- confirm directly against the sensitivity classification of data on each guest VM."
    manual: true
  - id: WAF-AVS-SEC-11
    title: "WAF-AVS-SEC-11. DevOps workflows for AVS-hosted workloads use modern auth"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-SEC-11. Application/pipeline configuration, not an AVS resource property -- confirm CI/CD workflows targeting AVS-hosted workloads use OAuth/OpenID Connect rather than long-lived credentials."
    manual: true

  # ---- Governance (WAF-AVS-GOV-01..08) -----------------------------------------------------------
  - id: WAF-AVS-GOV-01
    title: "WAF-AVS-GOV-01. vSAN datastore utilization is monitored with alerts"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-GOV-01. Metric alert rules are not projected into collect.json for any resource type -- confirm a Percentage Datastore Disk Used alert is configured directly in Azure Monitor."
    manual: true
  - id: WAF-AVS-GOV-02
    title: "WAF-AVS-GOV-02. VM templates use thin-provisioned storage policies"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-GOV-02. vSAN storage-policy configuration is not ARM-readable -- confirm templates default to thin- rather than thick-provisioned storage."
    manual: true
  - id: WAF-AVS-GOV-03
    title: "WAF-AVS-GOV-03. Host quota is sized ahead of growth/DR needs"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-GOV-03. A capacity-planning practice -- confirm host quota headroom is reviewed periodically against forecast growth and DR needs."
    manual: true
  - id: WAF-AVS-GOV-04
    title: "WAF-AVS-GOV-04. Failure-to-tolerate (FTT) vSAN settings match the cluster size for SLA compliance"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-GOV-04. vSAN-internal storage policy, not ARM-readable -- confirm FTT settings match the cluster size for the private cloud's SLA."
    manual: true
  - id: WAF-AVS-GOV-05
    title: "WAF-AVS-GOV-05. Service Health alerts configured for AVS issues, maintenance, and advisories"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-AVS-GOV-05. Activity Log alert rules are not projected into collect.json -- confirm a Service Health alert is configured for the AVS resource covering service issues, planned maintenance, and health advisories."
    manual: true
  - id: WAF-AVS-GOV-06
    title: "WAF-AVS-GOV-06. Cost governance is in place for AVS spend"
    severity: low
    # Evidences that budget infrastructure exists generally -- not that it is scoped to the AVS
    # resource specifically, which collect.json's budgets projection does not distinguish.
    query: "$.governance.budgets[*]"
    assert: { type: exists, gate: "$.governance.budgetsAvailable" }
    remediation: "WAF-AVS-GOV-06. No budget was found in scope, so there is no cost-governance infrastructure to evidence. Finding one does not prove it is scoped to AVS spend specifically -- confirm AVS-node cost allocation and alerting directly."
    manual: false
  - id: WAF-AVS-GOV-07
    title: "WAF-AVS-GOV-07. Azure PaaS services consumed by AVS workloads use private endpoints"
    severity: medium
    query: "$.networking.privateEndpoints[*]"
    assert: { type: exists }
    remediation: "WAF-AVS-GOV-07. No private endpoint was found in scope. Adopt Private Endpoints for PaaS services AVS workloads consume rather than exposing them publicly."
    manual: false
  - id: WAF-AVS-GOV-08
    title: "WAF-AVS-GOV-08. Workload VMs are onboarded to Azure Arc for policy/update/tag parity"
    severity: medium
    query: "$.domains.hybrid.arcServers[*]"
    assert: { type: exists }
    remediation: "WAF-AVS-GOV-08. No Arc-onboarded server was found in scope. Onboard AVS workload VMs to Azure Arc so they receive policy, update, and tag management parity with native Azure resources."
    manual: false
