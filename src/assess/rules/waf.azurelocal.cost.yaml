# AB#6803 (Feature AB#6747, Epic AB#6454) -- Cost Optimization-pillar rules for the Azure Local
# Well-Architected Review. See waf.azurelocal.reliability.yaml's header for why this is one of
# five separate per-pillar files.
#
# Two items (CO-01/CO-02) are genuinely organisational or pre-deployment and were never
# candidates for automation (the checklist marks both Unanswerable). CO-05/CO-06 name fields --
# Update Manager cost and Hybrid/ArcKubernetes presence -- that are Excel-inventory-only
# collectors not yet wired into collect.json's canonical `domains.*` contract this rule file
# queries; inventing a query against a path that does not exist there is the exact trap this
# epic exists to avoid. CO-03/CO-04 (Azure Hybrid Benefit / Software Assurance) were themselves
# in that same gap until AB#7093 added domains.hybrid.azureLocalClusters[].softwareAssuranceStatus
# (properties.softwareAssuranceProperties.softwareAssuranceStatus, the documented ARM field --
# learn.microsoft.com/azure/templates/microsoft.azurestackhci/clusters) to both the live ARG
# query and the -FromInventory conversion path; both now score automatically.
requires:
  - path: "$.domains.hybrid.azureLocalClusters[*]"
    description: "Azure Local clusters (Hybrid/Clusters)"
rules:
  - id: WAF-AZLOCAL-CO-01
    title: "Realistic costs are estimated as part of cost modeling"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AZLOCAL-CO-01. A pricing-calculator exercise, not a collected property. Confirm a cost model exists for the Azure Local deployment."
    manual: true

  - id: WAF-AZLOCAL-CO-02
    title: "Azure Local hardware cost is optimized (validated OEM catalog choice)"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AZLOCAL-CO-02. Hardware procurement choice predates any ARM resource Scout can read. Confirm the deployment used the Azure Local validated hardware catalog or a premium solution builder offering."
    manual: true

  - id: WAF-AZLOCAL-CO-03
    title: "Licensing costs are optimized (Azure Hybrid Benefit)"
    severity: medium
    # AB#7093: Software Assurance is the licensing vehicle Azure Hybrid Benefit for Azure Local
    # rides on -- a cluster with no Software Assurance intent set (null/empty) has not attached
    # the benefit. Named in Evidence by resourceGroup/name.
    query: "$.domains.hybrid.azureLocalClusters[?(@.softwareAssuranceStatus == null || @.softwareAssuranceStatus == '' || @.softwareAssuranceStatus == 'Disabled')]"
    assert: { type: countEquals, value: 0 }
    remediation: "WAF-AZLOCAL-CO-03. One or more Azure Local clusters has no Software Assurance benefit attached (domains.hybrid.azureLocalClusters[].softwareAssuranceStatus is null/empty/'Disabled'), so Azure Hybrid Benefit licensing savings are not being realised. Enable Software Assurance / Azure Hybrid Benefit for eligible clusters."
    manual: false

  - id: WAF-AZLOCAL-CO-04
    title: "Environment costs are saved (Hybrid Benefit, promotional/trial offers)"
    severity: low
    # Same signal as CO-03, scored as a percentage across the estate rather than a hard fail --
    # a tenant partway through a Software Assurance rollout should read as partial, not zero.
    query: "$.domains.hybrid.azureLocalClusters[?(@.softwareAssuranceStatus == 'Enabled')]"
    assert: { type: percentageAtLeast, value: 80, denominatorQuery: "$.domains.hybrid.azureLocalClusters[*]" }
    remediation: "WAF-AZLOCAL-CO-04. Fewer than 80% of Azure Local clusters have Software Assurance / Azure Hybrid Benefit enabled (domains.hybrid.azureLocalClusters[].softwareAssuranceStatus). Promotional/trial offers are not a collected field -- confirm those separately."
    manual: false

  - id: WAF-AZLOCAL-CO-05
    title: "Operational costs are saved (Update Manager, right-sized observability retention)"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AZLOCAL-CO-05. collect.json's management.logAnalyticsWorkspaces[].retentionInDays is a generic, tenant-wide field, not scoped to the Azure Local workspace specifically, so a rule here could not name the specific Azure Local resource behind the finding (this file's own naming requirement). Review Log Analytics retention for the Azure Local monitoring workspace, and Update Manager cost, manually."
    manual: true

  - id: WAF-AZLOCAL-CO-06
    title: "Density is evaluated over isolation (AKS on Azure Local for containerised workloads)"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-AZLOCAL-CO-06. Hybrid/ArcKubernetes is an Excel-inventory collector (manifests/collectors/Hybrid/ArcKubernetes.psd1) not yet wired into collect.json's canonical domains.hybrid contract. Confirm AKS on Azure Local adoption manually, or via the ArcKubernetes worksheet from an inventory run."
    manual: true
