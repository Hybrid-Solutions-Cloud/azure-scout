area: "Databases security & resilience"
framework: CAF
frameworkversion: "CAF design-area guidance, learn.microsoft.com/azure/cloud-adoption-framework, verified 2026-07-31 (docs/audits/AZURE-SCOUT-AUDIT.md, section 8)"
weight: 1.0
# AB#6798: service-guide file, not a CAF design area -- see caf.ai.yaml header for the pattern.
kind: service-guide
designAreaRef: "Security"
verifiedAgainst: "CAF landing zone design area: Security, learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/design-area/security, verified 2026-08-01"
rules:
  - id: CAF-DB-01
    title: "SQL servers disable public network access"
    severity: high
    query: "$.domains.databases.sqlServers[?(@.publicNetworkAccess == 'Enabled')]"
    assert: { type: countEquals, value: 0 }
    remediation: "Set publicNetworkAccess to Disabled and use private endpoints for SQL servers."
    manual: false
  - id: CAF-DB-02
    title: "Production SQL databases are zone-redundant"
    severity: medium
    query: "$.domains.databases.sqlDatabases[?(@.zoneRedundant == true)]"
    assert: { type: countGreaterThan, value: 0 }
    remediation: "Enable zone redundancy for Business Critical / Premium SQL databases."
    manual: false
  - id: CAF-DB-03
    title: "CAF-DB-03. Transparent Data Encryption is enabled on every SQL database"
    severity: high
    # Microsoft.Sql/servers/databases/transparentDataEncryption is an RP child
    # resource, not in the Resource Graph supported-tables-and-resource-types
    # reference (verified AB#5068) — Resource Graph cannot see it. Automated
    # (AB#9300, 3.18.20): the ARM sweep reads it with one GET per user database
    # (domains.databases.sqlTde, gated on the Measured flag). A database whose
    # state is not Enabled is a finding; `master` and dedicated pools are not asked.
    query: "$.domains.databases.sqlTde[?(@.enabled == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlTdeMeasured" }
    remediation: "CAF-DB-03. Transparent Data Encryption is not enabled on the databases listed. Enable TDE on each (it is on by default for new databases, so a disabled one was turned off deliberately or restored from a copy without it). A database whose TDE state could not be read is not listed."
    manual: false
  - id: CAF-DB-04
    title: "Microsoft Defender for SQL (Advanced Threat Protection) enabled"
    severity: high
    # Microsoft.Security/pricings ("SqlServers" plan) IS Resource Graph-indexed
    # (SecurityResources table) — see sqlDefenderPricing (Invoke-Collect.ps1,
    # AB#5068). Subscription-wide, coarse signal only (same tradeoff as
    # CAF-SEC-02/security.defenderPlans): confirms the Defender-for-SQL toggle,
    # not per-server auditing — that half is split out to CAF-DB-07 (still
    # manual) so this rule doesn't overstate what it verifies.
    query: "$.domains.databases.sqlDefenderPricing[?(@.pricingTier == 'Standard')]"
    assert: { type: exists }
    remediation: "Enable Microsoft Defender for SQL (the Defender for Cloud 'SqlServers' plan) at Standard tier for every subscription hosting SQL servers/databases."
    manual: false
  - id: CAF-DB-05
    title: "CAF-DB-05. SQL database point-in-time restore retention meets the minimum"
    severity: medium
    # Microsoft.Sql/servers/databases/backupShortTermRetentionPolicies (and the
    # long-term retention equivalent) are RP child resources, not in the
    # Resource Graph reference (verified AB#5068). Automated (AB#9300, 3.18.20)
    # for point-in-time restore: the ARM sweep reads the policy of each user
    # database (domains.databases.sqlBackupShortTerm) and a retention below the
    # service default of 7 days is a finding. The organisation's own minimum may
    # be higher, and long-term retention (domains.databases.sqlBackupLongTerm) is
    # only needed for compliance workloads, so that is evidence, not scored.
    query: "$.domains.databases.sqlBackupShortTerm[?(@.meetsMinimumRetention == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlBackupShortTermMeasured" }
    remediation: "CAF-DB-05. The databases listed keep point-in-time restore backups for fewer than 7 days (the service default). Raise retentionDays on each (up to 35). Check the result against the organisation's own minimum, which may be higher, and add long-term retention (weekly, monthly or yearly) for compliance workloads -- long-term retention is read (domains.databases.sqlBackupLongTerm: ltrConfigured) but not scored."
    manual: false
  - id: CAF-DB-06
    title: "CAF-DB-06. SQL server firewall rules exclude an 'allow all' entry"
    severity: high
    # Microsoft.Sql/servers/firewallRules is an RP child resource, not in the
    # Resource Graph reference (verified AB#5068). Automated (AB#9300, 3.18.20):
    # the ARM sweep lists each server's rules (domains.databases.sqlFirewallRules,
    # one row per server whose list answered) and reduces each to booleans -- the
    # addresses are never kept. A rule spanning the whole IPv4 space is a finding.
    # "Allow Azure services" (0.0.0.0) and ranges of /8 or wider are counted on the
    # row (allowAzureServicesRuleCount, broadRangeRuleCount) as evidence.
    query: "$.domains.databases.sqlFirewallRules[?(@.allowAllRuleCount > 0)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlFirewallRulesMeasured" }
    remediation: "CAF-DB-06. The SQL servers listed have a firewall rule that allows every IPv4 address (0.0.0.0 to 255.255.255.255). Remove it and scope rules to specific ranges or private endpoints. The 0.0.0.0 'Allow Azure services' rule and ranges of a /8 or wider are counted on each server's row (allowAzureServicesRuleCount, broadRangeRuleCount) but not scored: they are broad, and sometimes needed."
    manual: false
  - id: CAF-DB-07
    title: "SQL Server/Database auditing enabled to a durable destination"
    severity: high
    # Split from the old combined CAF-DB-04 (AB#5068): Microsoft.Sql/servers/
    # auditingSettings is an RP child resource that Resource Graph cannot see, so
    # this half of the original rule was manual. The phase 4 batch 2 ARM sweep now
    # reads it (domains.databases.sqlServerAuditing, one row per server whose GET
    # answered), so it is automated: a server whose auditing state is not Enabled
    # is a finding. An enabled audit always has a destination (storage, Log
    # Analytics or Event Hubs), so state Enabled is what "a durable destination"
    # means here. Gated on the Measured flag.
    query: "$.domains.databases.sqlServerAuditing[?(@.auditingState != 'Enabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlServerAuditingMeasured" }
    remediation: "SQL auditing is not enabled on the servers listed. Enable SQL Server auditing to a storage account, a Log Analytics workspace or Event Hubs, so access and changes are recorded durably. Server-level auditing covers every database on the server; database-level auditing settings are not read."
    manual: false
