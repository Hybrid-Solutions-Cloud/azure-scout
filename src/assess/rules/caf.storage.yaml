area: "Storage security & protection"
framework: CAF
frameworkversion: "CAF design-area guidance, learn.microsoft.com/azure/cloud-adoption-framework, verified 2026-07-31 (docs/audits/AZURE-SCOUT-AUDIT.md, section 8)"
weight: 1.0
# AB#6798: service-guide file, not a CAF design area -- see caf.ai.yaml header for the pattern.
kind: service-guide
designAreaRef: "Security"
verifiedAgainst: "CAF landing zone design area: Security, learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/design-area/security, verified 2026-08-01"
rules:
  - id: CAF-STO-01
    title: "Storage accounts disable public blob access"
    severity: high
    query: "$.domains.storage.storageAccounts[?(@.publicAccess == true)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Disable allowBlobPublicAccess on storage accounts; use private endpoints or SAS."
    manual: false
  - id: CAF-STO-02
    title: "Storage accounts enforce HTTPS-only traffic"
    severity: high
    query: "$.domains.storage.storageAccounts[?(@.httpsOnly == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Enable supportsHttpsTrafficOnly on all storage accounts."
    manual: false
  - id: CAF-STO-03
    title: "Storage accounts require TLS 1.2 minimum"
    severity: medium
    query: "$.domains.storage.storageAccounts[?(@.minTls == 'TLS1_0' || @.minTls == 'TLS1_1')]"
    assert: { type: countEquals, value: 0 }
    remediation: "Set minimumTlsVersion to TLS1_2 on all storage accounts."
    manual: false
  - id: CAF-STO-04
    title: "Storage accounts enable blob soft delete or versioning"
    severity: medium
    # domains.storage.blobServiceProperties is one row per account whose blob service answered; a feature the
    # account never enabled reads false. Soft delete OR versioning passes, so only an account with BOTH off is a
    # finding. Gated on the Measured flag so a run that never read the blob service is Not assessed.
    query: "$.domains.storage.blobServiceProperties[?(@.deleteRetentionEnabled == false && @.versioningEnabled == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.blobServicePropertiesMeasured" }
    remediation: "The storage accounts listed have neither blob soft delete (deleteRetentionPolicy) nor blob versioning (isVersioningEnabled), so an accidental or malicious delete or overwrite cannot be recovered. Enable soft delete and/or versioning. Accounts with a hierarchical namespace (Data Lake Storage) do not support versioning; use soft delete there."
    manual: false
  - id: CAF-STO-05
    title: "Storage account network rules default-deny with explicit allow-list"
    severity: high
    # properties.networkAcls.defaultAction is on the storage account resource
    # itself, so Invoke-Collect.ps1 now projects it as networkDefaultDeny (AB#5057).
    query: "$.domains.storage.storageAccounts[?(@.networkDefaultDeny == false)]"
    assert: { type: countEquals, value: 0 }
    remediation: "Set networkAcls.defaultAction to Deny and add explicit VNet/IP allow rules or private endpoints."
    manual: false
  - id: CAF-STO-06
    title: "Immutability policies applied to compliance-sensitive containers"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Apply time-based retention or legal hold immutability policies to containers holding regulated or audit-sensitive data. collect.json does not yet capture immutability policy state — verify via `az storage container immutability-policy show`."
    manual: true
