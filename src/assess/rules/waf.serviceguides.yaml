# waf.serviceguides.yaml -- Well-Architected service guides (AB#9300)
#
# Microsoft publishes a Well-Architected "service guide" per Azure service, each with a table of
# "Configuration recommendations" for every pillar. This file scores an estate against the ones whose
# setting Scout can read: the rule queries Scout's own collect.json, gated on the resource type
# existing, so an estate without a service reports that guide Not assessed rather than passed.
#
# Written ONLY against docs/frameworks/waf-service-guides-checklist.md. Microsoft does not number
# these recommendations, so the WAF-SVC-<SERVICE>-NN ids are Scout's. Each rule lists the resources
# that break the recommendation and passes at zero. Recommendations that no collected field can
# answer stay manual, with the closest evidence attached where there is some.
#
# Conventions worth knowing before editing a query:
#   * Newtonsoft JSONPath has no grouping parentheses and no defined && / || precedence, so every
#     filter is all-AND or all-OR; an either/or on a string is written as one regex.
#   * A property that is absent never matches == or !=, but null does match == null and < N, and a
#     projected string is '' when absent. "Absent means bad" settings are therefore written as
#     != true (booleans), < 1 (counts) or a regex that accepts the empty string (strings).
#   * Joins compare keys lower-cased and trimmed, so ARM id casing never produces a false finding.
#   * Zone items are limited to the regions Scout's VM zoneEligible list already treats as having
#     availability zones, so a region without zones is not failed for lacking them.
area: "Service guides"
framework: WAF-SVC
frameworkversion: "Azure Well-Architected Framework service guides (learn.microsoft.com/azure/well-architected/service-guides), docs/frameworks/waf-service-guides-checklist.md, retrieved 2026-11-25"
weight: 1.0
verifiedAgainst: "docs/frameworks/waf-service-guides-checklist.md (Scout enumeration of the Configuration recommendations tables of 20 service guides), verified 2026-11-25"
rules:

  # ---- Azure Kubernetes Service (WAF-SVC-AKS) -- https://learn.microsoft.com/azure/well-architected/service-guides/azure-kubernetes-service ----
  # Reliability: `tier`
  - id: WAF-SVC-AKS-01
    title: "WAF-SVC-AKS-01. Clusters use the Standard or Premium tier, which carries the uptime SLA"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.tier != 'Standard' && @.tier != 'Premium')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-01. The clusters listed run on the Free tier, which has no financially backed uptime SLA. Move production clusters to the Standard or Premium tier."
    manual: false
  # Reliability: `allPoolsZoned`, in zone regions
  - id: WAF-SVC-AKS-02
    title: "WAF-SVC-AKS-02. Every node pool is spread across availability zones"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.allPoolsZoned != true && @.location =~ /^(eastus|eastus2|westus2|westus3|centralus|southcentralus|northeurope|westeurope|uksouth|francecentral|germanywestcentral|switzerlandnorth|norwayeast|swedencentral|southeastasia|eastasia|australiaeast|japaneast|koreacentral|centralindia|canadacentral|brazilsouth|uaenorth|southafricanorth)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-02. The clusters listed have at least one node pool that is not spread across availability zones in a region that has them. Node pool zones are set at creation, so add zoned pools and drain the old ones."
    manual: false
  # Security: `aadIntegrated`
  - id: WAF-SVC-AKS-03
    title: "WAF-SVC-AKS-03. Clusters authenticate users through Microsoft Entra ID"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.aadIntegrated != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-03. The clusters listed are not integrated with Microsoft Entra ID. Enable AKS-managed Entra integration so cluster access follows your identity controls."
    manual: false
  # Security: `disableLocalAccounts`
  - id: WAF-SVC-AKS-04
    title: "WAF-SVC-AKS-04. Local accounts are disabled so every access goes through Microsoft Entra ID"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.disableLocalAccounts != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-04. The clusters listed still allow the local admin accounts, which bypass Microsoft Entra ID. Disable local accounts once Entra integration works."
    manual: false
  # Security: `azureRbac`
  - id: WAF-SVC-AKS-05
    title: "WAF-SVC-AKS-05. Kubernetes authorization uses Azure RBAC"
    severity: medium
    query: "$.domains.containers.aksClusters[?(@.azureRbac != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-05. The clusters listed authorize with Kubernetes RBAC alone. Turn on Azure RBAC for Kubernetes authorization so roles are managed with the rest of your Azure access."
    manual: false
  # Security: `privateCluster`, `authorizedIpRangeCount`
  - id: WAF-SVC-AKS-06
    title: "WAF-SVC-AKS-06. Public clusters limit the API server to authorized IP ranges"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.privateCluster != true && @.authorizedIpRangeCount < 1)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-06. The public clusters listed accept API server traffic from any address. Set authorized IP ranges (build agents, operations, node egress) or make the cluster private."
    manual: false
  # Security: `workloadIdentity`
  - id: WAF-SVC-AKS-07
    title: "WAF-SVC-AKS-07. Workloads use Microsoft Entra Workload ID"
    severity: medium
    query: "$.domains.containers.aksClusters[?(@.workloadIdentity != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-07. The clusters listed have workload identity turned off, so pods that call Azure services need stored credentials. Enable workload identity and federate pod service accounts."
    manual: false
  # Security: `defenderEnabled`
  - id: WAF-SVC-AKS-08
    title: "WAF-SVC-AKS-08. Microsoft Defender for Containers is enabled"
    severity: high
    query: "$.domains.containers.aksClusters[?(@.defenderEnabled != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-08. The clusters listed have the Defender security monitoring profile off. Enable Defender for Containers for runtime threat detection."
    manual: false
  # Security: `networkPolicyEnabled`
  - id: WAF-SVC-AKS-09
    title: "WAF-SVC-AKS-09. A network policy secures traffic between pods"
    severity: medium
    query: "$.domains.containers.aksClusters[?(@.networkPolicyEnabled != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-09. The clusters listed have no network policy engine. Use Azure CNI powered by Cilium or Calico network policies to limit pod-to-pod traffic."
    manual: false
  # Operational excellence: `upgradeChannel`
  - id: WAF-SVC-AKS-10
    title: "WAF-SVC-AKS-10. Automatic cluster upgrades are enabled"
    severity: medium
    query: "$.domains.containers.aksClusters[?(@.upgradeChannel =~ /^(none)?$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-10. The clusters listed have the upgrade channel set to none, so Kubernetes upgrades are manual. Choose the patch, stable or rapid channel and plan maintenance windows."
    manual: false
  # Cost optimization: `allPoolsAutoscale`
  - id: WAF-SVC-AKS-11
    title: "WAF-SVC-AKS-11. The cluster autoscaler scales every node pool"
    severity: low
    query: "$.domains.containers.aksClusters[?(@.allPoolsAutoscale != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-11. The clusters listed have node pools with a fixed node count. Enable the cluster autoscaler, or node auto-provisioning, so capacity follows demand. Clusters using node auto-provisioning can ignore this finding."
    manual: false
  # Security: evidence attached
  - id: WAF-SVC-AKS-12
    title: "WAF-SVC-AKS-12. Clusters that need strong API segmentation are private, and egress passes through a firewall, NAT gateway or proxy"
    severity: medium
    query: "$.domains.containers.aksClusters[?(@.privateCluster != true)]"
    assert: { type: manual, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-12. Confirm clusters with segmentation requirements use a private API server and that outbound traffic leaves through Azure Firewall, a NAT gateway or an HTTP proxy. Clusters that are not private are attached as evidence."
    manual: true
  # Security: no collected field
  - id: WAF-SVC-AKS-13
    title: "WAF-SVC-AKS-13. Azure Policy and deployment safeguards enforce pod and cluster standards"
    severity: medium
    query: null
    assert: { type: manual, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-13. Confirm the Azure Policy add-on and AKS deployment safeguards enforce resource limits, privilege restrictions and approved registries. Add-on state is not collected."
    manual: true
  # Reliability: evidence attached
  - id: WAF-SVC-AKS-14
    title: "WAF-SVC-AKS-14. Cluster state and application data are backed up, and maintenance is scheduled"
    severity: medium
    query: "$.management.maintenanceConfigurations[*]"
    assert: { type: manual, gate: "$.domains.containers.aksClusters[*]" }
    remediation: "WAF-SVC-AKS-14. Confirm Azure Backup for AKS protects the cluster and that planned maintenance windows govern cluster and node image upgrades. Maintenance configurations are attached as evidence."
    manual: true

  # ---- Azure App Service (Web Apps) (WAF-SVC-APP) -- https://learn.microsoft.com/azure/well-architected/service-guides/app-service-web-apps ----
  # Reliability: `tier`
  - id: WAF-SVC-APP-01
    title: "WAF-SVC-APP-01. App Service plans use the Premium v3 tier or above"
    severity: medium
    query: "$.domains.web.appServicePlans[?(@.tier =~ /^(Free|Shared|Basic|Standard|Premium|PremiumV2)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.appServicePlans[*]" }
    remediation: "WAF-SVC-APP-01. The plans listed are on the Free, Shared, Basic, Standard or Premium v2 tier. For production, move to Premium v3 for zone redundancy and better scaling; lower tiers are fine for development and test."
    manual: false
  # Reliability: `zoneRedundant`, in zone regions
  - id: WAF-SVC-APP-02
    title: "WAF-SVC-APP-02. Plans on a zone-capable tier are zone redundant"
    severity: high
    query: "$.domains.web.appServicePlans[?(@.zoneRedundant != true && @.tier =~ /^(PremiumV2|PremiumV3|Premium0V3|PremiumMV3|IsolatedV2)$/i && @.location =~ /^(eastus|eastus2|westus2|westus3|centralus|southcentralus|northeurope|westeurope|uksouth|francecentral|germanywestcentral|switzerlandnorth|norwayeast|swedencentral|southeastasia|eastasia|australiaeast|japaneast|koreacentral|centralindia|canadacentral|brazilsouth|uaenorth|southafricanorth)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.appServicePlans[*]" }
    remediation: "WAF-SVC-APP-02. The plans listed are on a tier that supports zone redundancy in a region that has zones, but the setting is off. Enable zone redundancy; it needs at least two instances."
    manual: false
  # Reliability: `instanceCount`
  - id: WAF-SVC-APP-03
    title: "WAF-SVC-APP-03. Plans run more than one instance"
    severity: high
    query: "$.domains.web.appServicePlans[?(@.instanceCount != null && @.instanceCount < 2 && @.tier =~ /^(Basic|Standard|Premium|PremiumV2|PremiumV3|Premium0V3|PremiumMV3|IsolatedV2)$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.appServicePlans[*]" }
    remediation: "WAF-SVC-APP-03. The plans listed run a single instance, which is a single point of failure. Run at least two instances, or three or more across zones."
    manual: false
  # Performance efficiency: `appServicePlans` to enabled `autoscaleSettings`
  - id: WAF-SVC-APP-04
    title: "WAF-SVC-APP-04. Plans on a tier that supports it have an enabled autoscale setting"
    severity: medium
    join:
      left: "$.domains.web.appServicePlans[?(@.tier =~ /^(Standard|Premium|PremiumV2|PremiumV3|Premium0V3|PremiumMV3|IsolatedV2)$/i)]"
      leftKey: "id"
      right: "$.monitor.autoscaleSettings[?(@.enabled == true)]"
      rightKey: "targetResourceUri"
      mode: leftOnly
      leftLabel: "App Service plan"
      rightLabel: "enabled autoscale setting"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.appServicePlans[*]" }
    remediation: "WAF-SVC-APP-04. The plans listed have no enabled Azure Monitor autoscale setting. Add autoscale rules so instances follow load. Plans that use the built-in automatic scaling feature can ignore this finding."
    manual: false
  # Security: `identityType`
  - id: WAF-SVC-APP-05
    title: "WAF-SVC-APP-05. Web apps have a managed identity"
    severity: medium
    query: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i && @.identityType =~ /^(none)?$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-05. The web apps listed have no managed identity, so they need stored credentials to reach other Azure services. Assign a system-assigned or user-assigned identity per app."
    manual: false
  # Security: `httpsOnly`
  - id: WAF-SVC-APP-06
    title: "WAF-SVC-APP-06. Web apps accept HTTPS only"
    severity: high
    query: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i && @.httpsOnly != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-06. The web apps listed still accept plain HTTP. Turn on HTTPS Only."
    manual: false
  # Security: `minTls`
  - id: WAF-SVC-APP-07
    title: "WAF-SVC-APP-07. Web apps require TLS 1.2 or higher"
    severity: high
    query: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i && @.minTls =~ /^(1[.]0|1[.]1)$/)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-07. The web apps listed allow TLS 1.0 or 1.1. Set the minimum inbound TLS version to 1.2 or higher."
    manual: false
  # Security: `publicNetworkAccess`
  - id: WAF-SVC-APP-08
    title: "WAF-SVC-APP-08. Web apps block public network access"
    severity: medium
    query: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i && @.publicNetworkAccess != 'Disabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-08. The web apps listed allow public network access. Add a private endpoint and set public network access to Disabled. Apps that rely on access restrictions instead can record an exception."
    manual: false
  # Security: `vnetIntegrated`
  - id: WAF-SVC-APP-09
    title: "WAF-SVC-APP-09. Web apps are integrated with a virtual network"
    severity: medium
    query: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i && @.vnetIntegrated != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-09. The web apps listed have no virtual network integration, so outbound traffic leaves over the public network. Enable regional virtual network integration and route all outbound traffic through it."
    manual: false
  # Security: `customDomainBound`
  - id: WAF-SVC-APP-10
    title: "WAF-SVC-APP-10. Web apps use a custom domain"
    severity: low
    query: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i && @.customDomainBound != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-10. The web apps listed only use the default azurewebsites.net name. Bind a custom domain with a certificate; App Service managed certificates are free."
    manual: false
  # Security: Defender plan `AppServices`
  - id: WAF-SVC-APP-11
    title: "WAF-SVC-APP-11. Microsoft Defender for App Service is enabled"
    severity: high
    query: "$.security.defenderPlans[?(@.name == 'AppServices' && @.properties.pricingTier != 'Standard')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-11. Defender for App Service is not on the Standard tier in the subscriptions listed. Enable it to detect threats against apps and plans."
    manual: false
  # Operational excellence: diagnostic-settings coverage of `microsoft.web/sites`
  - id: WAF-SVC-APP-12
    title: "WAF-SVC-APP-12. Web apps send diagnostic logs to a destination"
    severity: medium
    query: "$.opsPosture.diagnosticCoverage[?(@.type =~ /microsoft[.]web.sites/ && @.coveragePct < 100)]"
    assert: { type: countEquals, value: 0, gate: "$.opsPosture.diagnosticCoverage[?(@.type =~ /microsoft[.]web.sites/)]" }
    remediation: "WAF-SVC-APP-12. Some web apps have no diagnostic setting. Send app and platform logs to Log Analytics and keep an audit trail."
    manual: false
  # Reliability: no collected field
  - id: WAF-SVC-APP-13
    title: "WAF-SVC-APP-13. Health check, auto-heal and Always On are configured"
    severity: medium
    query: null
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-13. Confirm the health check path polls the app dependencies, auto-heal rules cover slow requests and memory limits, and Always On is set where WebJobs or shared plans need it. None of these site settings is collected."
    manual: true
  # Security: no collected field
  - id: WAF-SVC-APP-14
    title: "WAF-SVC-APP-14. Basic authentication, FTP and remote debugging are disabled, and secrets use Key Vault references"
    severity: high
    query: null
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-14. Confirm basic authentication for deployment and SCM is off, FTP is disabled, remote debugging is off, and app settings use Key Vault references. None of these site settings is collected."
    manual: true
  # Security: no collected field
  - id: WAF-SVC-APP-15
    title: "WAF-SVC-APP-15. Built-in authentication or Microsoft Entra ID authentication protects the app, with restrictive CORS"
    severity: medium
    query: null
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-15. Confirm user-facing apps authenticate with Microsoft Entra ID, either through App Service authentication or in code, and that CORS allows only the domains you need. Authentication settings are not collected."
    manual: true
  # Operational excellence: no collected field
  - id: WAF-SVC-APP-16
    title: "WAF-SVC-APP-16. Releases go through deployment slots and a pipeline"
    severity: medium
    query: null
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-16. Confirm production deploys by swapping a validated staging slot, from a CI/CD pipeline. Slots are not collected."
    manual: true
  # Cost optimization: evidence attached
  - id: WAF-SVC-APP-17
    title: "WAF-SVC-APP-17. Lower environments use Free or Basic plans, and steady workloads use reservations"
    severity: low
    query: "$.domains.web.appServicePlans[*]"
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /^(?!.*functionapp)/i)]" }
    remediation: "WAF-SVC-APP-17. Review plans by environment; use Free or Basic for experiments and reserved instances or savings plans for stable Premium v3 use. Plans are attached as evidence."
    manual: true

  # ---- Azure Functions (WAF-SVC-FUNC) -- https://learn.microsoft.com/azure/well-architected/service-guides/azure-functions ----
  # Security: `identityType`
  - id: WAF-SVC-FUNC-01
    title: "WAF-SVC-FUNC-01. Function apps have a managed identity"
    severity: medium
    query: "$.domains.web.webApps[?(@.kind =~ /functionapp/i && @.identityType =~ /^(none)?$/i)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-01. The function apps listed have no managed identity. Enable one so bindings and Key Vault references use identity instead of connection strings."
    manual: false
  # Security: `httpsOnly`
  - id: WAF-SVC-FUNC-02
    title: "WAF-SVC-FUNC-02. Function apps accept HTTPS only"
    severity: high
    query: "$.domains.web.webApps[?(@.kind =~ /functionapp/i && @.httpsOnly != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-02. The function apps listed still accept plain HTTP. Turn on HTTPS Only."
    manual: false
  # Security: `publicNetworkAccess`
  - id: WAF-SVC-FUNC-03
    title: "WAF-SVC-FUNC-03. Function apps block public network access"
    severity: medium
    query: "$.domains.web.webApps[?(@.kind =~ /functionapp/i && @.publicNetworkAccess != 'Disabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-03. The function apps listed allow public network access. Use private endpoints and disable public access where clients can reach the virtual network. Not available on the Consumption plan."
    manual: false
  # Security: `vnetIntegrated`
  - id: WAF-SVC-FUNC-04
    title: "WAF-SVC-FUNC-04. Function apps are integrated with a virtual network"
    severity: medium
    query: "$.domains.web.webApps[?(@.kind =~ /functionapp/i && @.vnetIntegrated != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-04. The function apps listed have no virtual network integration. Use a Flex Consumption, Elastic Premium or Dedicated plan and enable integration. Not available on the Consumption plan."
    manual: false
  # Security: no collected field
  - id: WAF-SVC-FUNC-05
    title: "WAF-SVC-FUNC-05. Secrets come from Key Vault and the app requires Microsoft Entra ID authentication"
    severity: medium
    query: null
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-05. Confirm connection strings and keys are Key Vault references and that HTTP triggers sit behind Microsoft Entra ID authentication. App settings are not collected."
    manual: true
  # Reliability: evidence attached
  - id: WAF-SVC-FUNC-06
    title: "WAF-SVC-FUNC-06. Retries, Durable Functions and availability zones are used where the workload needs them"
    severity: medium
    query: "$.domains.web.appServicePlans[?(@.tier =~ /^(Dynamic|ElasticPremium|FlexConsumption)$/i)]"
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-06. Confirm transient failures use retry policies, long-running work uses Durable Functions, and critical apps use Flex Consumption or Premium plans across availability zones. Plan tiers are attached as evidence."
    manual: true
  # Operational excellence: evidence attached
  - id: WAF-SVC-FUNC-07
    title: "WAF-SVC-FUNC-07. Function apps send telemetry to Application Insights and deploy through CI/CD with slots"
    severity: medium
    query: "$.monitor.appInsights[*]"
    assert: { type: manual, gate: "$.domains.web.webApps[?(@.kind =~ /functionapp/i)]" }
    remediation: "WAF-SVC-FUNC-07. Confirm monitoring uses Application Insights and that deployments come from a pipeline into staging slots. Application Insights components are attached as evidence."
    manual: true

  # ---- Azure Container Apps (WAF-SVC-ACA) -- https://learn.microsoft.com/azure/well-architected/service-guides/azure-container-apps ----
  # Reliability: `zoneRedundant`, in zone regions
  - id: WAF-SVC-ACA-01
