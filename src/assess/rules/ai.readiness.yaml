  - id: AIRDY-MM-05
    title: "AIRDY-MM-05. Prompt and model changes are managed with rollback"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "AIRDY-MM-05. Organisational -- confirm changes to prompts, models and orchestration go through change control with a rollback procedure."
    manual: true
  - id: AIRDY-MM-06
    title: "AIRDY-MM-06. Model drift and decay are monitored"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "AIRDY-MM-06. Organisational -- confirm output quality, relevance and drift are monitored in production, with retraining or tuning triggered when they degrade."
    manual: true
  - id: AIRDY-MM-07
    title: "AIRDY-MM-07. A workspace or registry tracks custom models and experiments"
    severity: medium
    query: "$.domains.ai.mlWorkspaces[*]"
    assert: { type: manual }
    remediation: "AIRDY-MM-07. Organisational -- confirm custom models, experiments and versions are tracked in one place (machine learning workspaces are attached as evidence)."
    manual: true
  - id: AIRDY-MM-08
    title: "AIRDY-MM-08. Fine-tuning is governed"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "AIRDY-MM-08. Organisational -- confirm fine-tuning has an approval step, data quality checks and a plan to repeat it when the base model changes."
    manual: true
  - id: AIRDY-MM-09
    title: "AIRDY-MM-09. Content safety guardrails are bound to every model deployment"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "AIRDY-MM-09. Organisational -- confirm each deployment has content filtering for prompts and completions, with thresholds reviewed against the use case."
