area: "Security"
framework: "Cloud Governance"
weight: 0.142857
# Per-category citations for this file:
#   monitor-cloud-governance#configure-monitoring-for-security-governance
#   enforce-cloud-governance-policies#automate-security-governance
#   monitor-cloud-governance#azure-facilitation-configuring-cloud-governance-alerts
frameworkversion: "CAF Govern — 5-step process (team, assess risks, document, enforce, monitor) x 7 categories (RC, SC, CM, OP, DG, RM, AI); learn.microsoft.com/azure/cloud-adoption-framework/govern/; verified 2026-11-24"
rules:
  - id: CGOV-SC-01
    title: "Security recommendations are reviewed and secure score is monitored over time"
    severity: medium
    # Defender secure score / assessments are collected by the raw v1 collectors
    # (Security/DefenderSecureScore, Security/DefenderAssessments) but are not wired into
    # collect.json's domains.security schema the v3 rule engine reads (only
    # domains.security.keyVaults and security.defenderPlans are), and
    # even if they were, a single collect.json is one point in time -- it cannot prove a
    # trend was "monitored over time" without a retained history Scout does not keep between
    # runs. Scoring "exists" here would be a proxy for a claim ("monitored over time") the
    # data cannot support -- manual, not a false pass.
    query: null
    assert: { type: manual }
    remediation: "Confirm Defender secure score is reviewed on a recurring cadence (not just point-in-time) and recommendations are actioned or formally risk-accepted."
    manual: true

  - id: CGOV-SC-02
    title: "A regulatory-compliance dashboard is checked against common security frameworks (MCSB, CIS, etc.)"
    severity: high
    # Same dataset as CGOV-RC-01/CGOV-OP-01 -- policyComplianceStates carries no field
    # distinguishing which regulatory-compliance initiative (MCSB/CIS/ISO/NIST/...) each
    # state belongs to, so this can only evidence "some compliance dashboard data exists",
    # not "MCSB specifically was checked". Existence is still meaningful evidence: a tenant
    # with zero compliance rows has definitely not done this. See the Compliance assessment
    # (Assess: Compliance / Get-ScoutComplianceScore.ps1) for the per-initiative breakdown
    # this rule cannot see.
    query: "$.domains.management.policyComplianceStates[*]"
    assert: { type: countGreaterThan, value: 0 }
    remediation: "Run the 'Assess: Compliance' assessment for a per-initiative (MCSB/CIS/ISO/NIST/PCI-DSS) breakdown rather than relying on this generic existence check."
    manual: false

  - id: CGOV-SC-03
    title: "Identity governance monitoring is configured — audit/sign-in/provisioning logs, identity secure score, an identity-governance dashboard"
    severity: high
    # Sign-in/audit/provisioning logs are not part of collect.json's identity domain, and whether a
    # dashboard exists or access reviews run monthly cannot be read from Azure, so this item stays
    # manual. What Scout CAN now show is the MFA half of Microsoft's example policy SC01: the
    # enabled Conditional Access policies that require MFA for all users are attached as evidence
    # (domains.identity.conditionalAccess, read from Entra -- empty when Graph was not read). They
    # do not answer the other parts, so none of them is scored here.
    query: "$.domains.identity.conditionalAccess.policies[?(@.enabled == true && @.requiresMfa == true && @.targetsAllUsers == true)]"
    assert: { type: manual }
    remediation: "Configure Microsoft Entra sign-in/audit log export, review identity secure score, and stand up an identity-governance dashboard. Confirm access reviews run on the cadence your policy states. The Conditional Access policies listed as evidence (if any) show where MFA is required for all users; no listed policy means Scout either found none or could not read Conditional Access (domains.identity.conditionalAccess.Reason in collect.json says which)."
    manual: true

  - id: CGOV-SC-04
    title: "Microsoft Defender for Cloud paid plans are enabled so security alerts are generated"
    severity: high
    # monitor-cloud-governance#azure-facilitation-configuring-cloud-governance-alerts: "Security
    # governance alerts. Configure security alerts ..." -- the alerts come from the Defender plans;
    # a subscription on the Free tier for every plan produces no workload alerts. security.defenderPlans
    # rows carry name + properties.pricingTier (the same shape caf.security.yaml reads).
    # Gated on the plan data itself: when no plan row was collected at all (sweep failed, or the
    # Security category was not requested) the answer is "not assessed", never a Fail.
    query: "$.security.defenderPlans[?(@.properties.pricingTier == 'Standard')]"
    assert: { type: exists, gate: "$.security.defenderPlans[*]" }
    remediation: "Enable the Defender for Cloud plans that match the workloads you run (Servers, Storage, Databases, Containers, Key Vault, App Service) and route the resulting alerts to the team that owns security."
    manual: false

  - id: CGOV-SC-05
    title: "Just-in-time privileged access is used (Privileged Identity Management eligible assignments exist)"
    severity: medium
    # enforce-cloud-governance-policies#automate-security-governance: "Enable just-in-time access
    # to limit access to important resources" (Privileged Identity Management). Same dataset and
    # gate as the CAF-IDN rules: the Azure RBAC eligibility schedules Scout reads per subscription
    # (Get-AzRoleEligibilitySchedule, an Azure Resource Manager read the Reader role covers).
    # governance.pimEligibilityAvailable is true only when every subscription answered, so a
    # subscription that could not be read reads NotAssessed (never a Fail and never a Pass).
    query: "$.governance.pimEligibility[*]"
    assert: { type: exists, gate: "$.governance.pimEligibilityAvailable" }
    remediation: "No PIM eligible role assignment exists on any subscription. Convert standing privileged role assignments to PIM eligible assignments with approval and time limits. If this check reads Not assessed, governance.pimEligibilityReason in collect.json names the subscription read that failed."
    manual: false

  - id: CGOV-SC-06
    title: "Defender for Cloud security alerts are reviewed, routed to an owner and resolved"
    severity: medium
    # Alert rows exist only when -IncludePolicyCompliance was requested (security.defenderAlerts
    # comes from the same sweep as policyComplianceStates). Alerts existing says nothing about
    # whether anyone reviewed them, so the rows are attached as evidence and the question stays
    # manual.
    query: "$.security.defenderAlerts[*]"
    assert: { type: manual }
    remediation: "Confirm Defender for Cloud alerts are routed (email, ticketing, or a SIEM) to a named owner and that open alerts are triaged within the timeline your governance policy sets."
    manual: true

  - id: CGOV-SC-07
    title: "A security-standard initiative (Microsoft cloud security benchmark, CIS, NIST SP 800-53, ISO 27001) is assigned"
    severity: medium
    # enforce-cloud-governance-policies#automate-security-governance: "There are built-in policies
    # for NIST SP 800 series, Center for Internet Security benchmarks, and the Microsoft cloud
    # security benchmark." An initiative assignment is recognised by its definition id (a
    # policySetDefinitions id) and its display name, which defaults to the initiative's name. The
    # assignment says the standard is being audited; whether the tenant PASSES it is
    # CGOV-RC-01/CGOV-SC-02 and the Compliance assessment.
    query: "$.governance.policyAssignments[?(@.properties.policyDefinitionId =~ /policySetDefinitions/i && @.properties.displayName =~ /security benchmark|\\bCIS\\b|\\bNIST\\b|ISO ?27001/i)]"
    assert: { type: exists, gate: "$.governance.policyAssignmentsAvailable" }
    remediation: "Assign the Microsoft cloud security benchmark initiative (and CIS or NIST SP 800-53 where required) at management-group scope so security configuration is audited continuously. An initiative assigned under a custom display name is not recognised by this check."
    manual: false
