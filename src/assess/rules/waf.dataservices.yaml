  # ---- COS, Performance efficiency ---------------------------------------------------------
  # data-plane design [COS-PE-R]
  - id: WAF-DATA-COS-16
    title: "WAF-DATA-COS-16. Data model, partition key and queries are designed for performance"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-COS-16. Keep items small, choose an even partition key, avoid cross-partition queries, use Direct mode and bulk, and consider composite indexes."
    manual: true
  # accounts attached with location [COS-PE-R]
  - id: WAF-DATA-COS-17
    title: "WAF-DATA-COS-17. Regions are close to users and multi-region writes are used where clients are distributed"
    severity: low
    query: "$.domains.databases.cosmosDbAccounts[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-COS-17. Deploy near users and use multi-region writes if the workload can handle conflict resolution. Accounts are attached."
    manual: true

  # ---- PG, Reliability ---------------------------------------------------------------------
