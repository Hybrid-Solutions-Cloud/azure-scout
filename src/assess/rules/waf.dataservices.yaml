  # publicNetworkAccess: only Disabled and SecuredByPerimeter pass; an absent value means enabled [BLOB-SE-S]
  - id: WAF-DATA-BLOB-15
    title: "WAF-DATA-BLOB-15. Public network access is disabled on storage accounts"
    severity: high
    query: "$.domains.storage.storageAccounts[?(@.publicNetworkAccess != 'Disabled' && @.publicNetworkAccess != 'SecuredByPerimeter')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-15. The accounts listed have public network access enabled (an absent value means enabled), including accounts limited to selected networks. Disable it and reach the account over private endpoints or a network security perimeter; an account that must stay reachable from selected networks is an accepted exception that WAF-DATA-BLOB-04 still checks."
    manual: false
  # legacy account kinds: Storage is general-purpose v1 (StorageV1 is the portal name), BlobStorage is the legacy blob-only kind [GPV1]
  - id: WAF-DATA-BLOB-16
    title: "WAF-DATA-BLOB-16. Storage accounts are general-purpose v2 or a premium kind, not a legacy general-purpose v1 or blob-only account"
    severity: medium
    query: "$.domains.storage.storageAccounts[?(@.kind == 'Storage' || @.kind == 'StorageV1' || @.kind == 'BlobStorage')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-16. The accounts listed are general-purpose v1 or legacy blob-only accounts. Microsoft's retirement of both kinds (general-purpose v1 was set for 2026-10-13) means any account not upgraded is migrated automatically; upgrade to general-purpose v2 yourself to choose the access tier and avoid a surprise change in billing. Lifecycle management, per-blob tiering and point-in-time restore need general-purpose v2."
    manual: false
