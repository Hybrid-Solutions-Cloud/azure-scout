# waf.dataservices.yaml -- Data Services technology review (AB#9300)
#
# Scores Scout's reading of the Well-Architected service guides for the data services, the scope of Microsoft's
# "Data Services" Well-Architected review (learn.microsoft.com/assessments/azure-architecture-review-data). Microsoft does
# not publish the review's question text, so every item is Scout's reading of the guides' design checklists and
# configuration-recommendation tables, enumerated in docs/frameworks/waf-data-services-checklist.md. Every rule cites
# an id from that file; the id is WAF-DATA-<service>-NN.
#
# WHY framework: WAF-DATA and not WAF: the review spans eight services and all five pillars, so no single pillar area
# fits; it is a Scout-internal axis like WAF-AI.
#
# Azure HorizonDB has no collected dataset yet, so its items are all manual. The settings the first pass lacked (SQL server
# id, TLS and Entra-only flags, backup redundancy, Cosmos regions and failover, PostgreSQL and MySQL high availability,
# Redis access keys and TLS, storage shared-key access and key source) are now projected, so those items are automated.
# What is still manual is what ARM does not carry on the parent resource: child resources (failover groups, backup
# policies, audit settings), data-plane configuration, client code and judgement about workload fit.
#
# Absent-means-bad: an ARG projection yields '' for a missing string and null for a missing boolean. Newtonsoft JSONPath
# never matches a MISSING property with == or !=, but a null or '' value does match !=, so the filters below are written
# as "is not the good value" (never "is the bad value") wherever absence is itself the finding: storage minimumTlsVersion
# absent (older accounts default to TLS 1.0), allowSharedKeyAccess absent (allowed), the SQL Entra-only flag absent (SQL
# authentication only). Redis access-key authentication is only projected for classic caches (microsoft.cache/redis);
# Redis Enterprise keeps it on a child database, so that rule is scoped to the classic type and gated on it.
# Every automated rule is gated on its resources (or their diagnostic-coverage rows) existing.
area: "Data services"
framework: WAF-DATA
frameworkversion: "Azure Well-Architected Framework service guides for Azure SQL Database, SQL Managed Instance, Cosmos DB, Database for PostgreSQL, Database for MySQL, Azure Managed Redis, Azure HorizonDB and Blob Storage (Microsoft's review question text unpublished), docs/frameworks/waf-data-services-checklist.md, retrieved 2026-11-25 (104 items)"
# (customer-managed-key items COS-11, MI-06 and BLOB-07 are manual with the not-on-CMK resources as evidence: CMK is requirement-driven)
weight: 1.0
verifiedAgainst: "docs/frameworks/waf-data-services-checklist.md (Scout enumeration of learn.microsoft.com/azure/well-architected/service-guides/*), verified 2026-11-25"
rules:

  # ---- SQL, Reliability --------------------------------------------------------------------
  # database zoneRedundant (master excluded) [SQL-RE-R]
  - id: WAF-DATA-SQL-01
    title: "WAF-DATA-SQL-01. SQL databases are zone redundant"
    severity: high
    query: "$.domains.databases.sqlDatabases[?(@.zoneRedundant != true && @.name != 'master')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlDatabases[*]" }
    remediation: "WAF-DATA-SQL-01. The databases listed are not zone redundant. Configure zone redundancy so compute and storage span availability zones and survive a zone outage without losing committed data."
    manual: false
  # failover groups and replica links are child resources, not collected (proposed in the report); servers attached [SQL-RE-C, SQL-RE-R]
  - id: WAF-DATA-SQL-02
    title: "WAF-DATA-SQL-02. Active geo-replication or failover groups protect against a regional failure"
    severity: high
    query: "$.domains.databases.sqlServers[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-02. Use failover groups for automatic failover with unchanged listener endpoints, or active geo-replication for a readable secondary. The failover group and replica links are not collected."
    manual: true
  # backup policy is a child resource, not collected [SQL-RE-R]
  - id: WAF-DATA-SQL-03
    title: "WAF-DATA-SQL-03. Backups cover point-in-time restore, geo-restore and long-term retention, with immutability"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-03. Configure PITR, geo-restore and LTR and enable backup immutability aligned to retention needs."
    manual: true
  # the tier of each database is attached; which are critical is judgement [SQL-RE-C]
  - id: WAF-DATA-SQL-04
    title: "WAF-DATA-SQL-04. Critical databases use the Business Critical or Hyperscale tier"
    severity: medium
    query: "$.domains.databases.sqlDatabases[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-04. Business Critical gives the highest reliability guarantees; Hyperscale suits strict RTO and RPO. Databases are attached with their tier."
    manual: true
  # client code, not ARM [SQL-RE-C, SQL-RE-R]
  - id: WAF-DATA-SQL-05
    title: "WAF-DATA-SQL-05. Applications retry with backoff and isolate connection pools by function"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-05. Implement retry with backoff and give each functional area its own connection pool (Application Name)."
    manual: true

  # ---- SQL, Security -----------------------------------------------------------------------
  # server publicNetworkAccess [SQL-SE-R]
  - id: WAF-DATA-SQL-06
    title: "WAF-DATA-SQL-06. SQL servers have public network access disabled"
    severity: high
    query: "$.domains.databases.sqlServers[?(@.publicNetworkAccess != 'Disabled')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlServers[*]" }
    remediation: "WAF-DATA-SQL-06. The servers listed allow public network access. Disable it and use Private Link."
    manual: false
  # server to private endpoint join (the server id is projected) [SQL-SE-R]
  - id: WAF-DATA-SQL-07
    title: "WAF-DATA-SQL-07. Each SQL server has a private endpoint"
    severity: medium
    join:
      left: "$.domains.databases.sqlServers[*]"
      leftKey: "id"
      right: "$.networking.privateEndpoints[*]"
      rightKey: "targetResourceId"
      mode: "leftOnly"
      leftLabel: "SQL server"
      rightLabel: "private endpoint"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlServers[*]" }
    remediation: "WAF-DATA-SQL-07. The servers listed have no private endpoint. Use Azure Private Link so clients connect privately."
    manual: false
  # minimalTlsVersion: only 1.2 and 1.3 pass; '' (absent), None, 1.0 and 1.1 are all findings [SQL-SE-R]
  - id: WAF-DATA-SQL-08
    title: "WAF-DATA-SQL-08. The minimum TLS version is 1.2 or higher"
    severity: medium
    query: "$.domains.databases.sqlServers[?(@.minimalTlsVersion != '1.2' && @.minimalTlsVersion != '1.3')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlServers[*]" }
    remediation: "WAF-DATA-SQL-08. The servers listed allow TLS older than 1.2, or carry no minimum TLS version (which allows every version). Set the minimal TLS version to 1.2, and 1.3 where practical."
    manual: false
  # administrators.azureADOnlyAuthentication: null when no Entra administrator is set, which is SQL authentication only [SQL-SE-R]
  - id: WAF-DATA-SQL-09
    title: "WAF-DATA-SQL-09. SQL authentication is disabled and Microsoft Entra-only authentication is on"
    severity: medium
    query: "$.domains.databases.sqlServers[?(@.entraOnlyAuth != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlServers[*]" }
    remediation: "WAF-DATA-SQL-09. The servers listed still allow SQL authentication, or have no Microsoft Entra administrator (an absent flag is read as not Entra-only). Allow Microsoft Entra authentication only and configure a user-assigned managed identity as the server identity."
    manual: false
  # subscription Defender for SQL tier [SQL-SE-R]
  - id: WAF-DATA-SQL-10
    title: "WAF-DATA-SQL-10. Microsoft Defender for SQL is on Standard"
    severity: medium
    query: "$.domains.databases.sqlDefenderPricing[?(@.pricingTier != 'Standard')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlServers[*]" }
    remediation: "WAF-DATA-SQL-10. The subscriptions listed do not have Defender for SQL on the Standard tier. Enable vulnerability assessment and advanced threat protection. (Checked per subscription.)"
    manual: false
  # auditing and column encryption are not collected [SQL-SE-R]
  - id: WAF-DATA-SQL-11
    title: "WAF-DATA-SQL-11. Auditing is on with immutable storage, and sensitive data is protected with Always Encrypted or ledger"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-11. Track events with SQL auditing to immutable storage and use Always Encrypted (with enclaves) or ledger tables for sensitive data."
    manual: true

  # ---- SQL, Cost optimization --------------------------------------------------------------
  # elastic pools attached; databases are in the reliability item [SQL-CO-R]
  - id: WAF-DATA-SQL-12
    title: "WAF-DATA-SQL-12. The service tier, serverless and elastic pools match each database's use"
    severity: low
    query: "$.domains.databases.sqlElasticPools[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-12. Choose the tier from capacity planning; consider Serverless for intermittent use, Hyperscale for flexibility and elastic pools for varied demand. Databases and pools are attached."
    manual: true
  # reservations attached [SQL-CO-R]
  - id: WAF-DATA-SQL-13
    title: "WAF-DATA-SQL-13. Reserved capacity and Azure Hybrid Benefit are used for steady workloads"
    severity: low
    query: "$.finops.reservations[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-13. Reserve compute for one or three years and apply Azure Hybrid Benefit with Software Assurance. Reservations are attached."
    manual: true
  # metrics, not ARM [SQL-CO-R]
  - id: WAF-DATA-SQL-14
    title: "WAF-DATA-SQL-14. Backup storage consumption is tuned and queries are optimised to cut resource use"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-14. Review backup storage per type and use Query Performance Insight and recommendations to right-size."
    manual: true

  # ---- SQL, Operational excellence ---------------------------------------------------------
  # diagnostic-settings coverage for the database type [SQL-OE-R]
  - id: WAF-DATA-SQL-15
    title: "WAF-DATA-SQL-15. SQL databases send diagnostics to Log Analytics"
    severity: low
    query: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.sql/servers/databases' && @.coveragePct < 100)]"
    assert: { type: countEquals, value: 0, gate: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.sql/servers/databases')]" }
    remediation: "WAF-DATA-SQL-15. Some databases have no diagnostic setting. Monitor with diagnostic settings and database watcher to detect reliability incidents."
    manual: false
  # practice, not ARM [SQL-OE-R]
  - id: WAF-DATA-SQL-16
    title: "WAF-DATA-SQL-16. SQL projects deploy through CI/CD and servers are backed up with Azure Backup"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-16. Use IaC and CI/CD for schema and infrastructure; use Azure Backup for centralised, cross-region restore."
    manual: true

  # ---- SQL, Performance efficiency ---------------------------------------------------------
  # database-scoped configuration, not collected [SQL-PE-R]
  - id: WAF-DATA-SQL-17
    title: "WAF-DATA-SQL-17. Query Store, automatic tuning and performance recommendations are enabled and acted on"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-17. Use automatic tuning, Query Store and Query Performance Insight; resolve blocking and deadlocks."
    manual: true
  # databases attached with tier and highAvailabilityReplicaCount; connection pooling is client code, so the item stays manual [SQL-PE-C, SQL-PE-R]
  - id: WAF-DATA-SQL-18
    title: "WAF-DATA-SQL-18. The vCore model, read scale-out and connection pooling are used"
    severity: low
    query: "$.domains.databases.sqlDatabases[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-SQL-18. Prefer vCore, offload reads to replicas and pool connections. Databases are attached with their tier (Basic, Standard and Premium are the DTU model) and replica count; pooling is client code and cannot be read from ARM."
    manual: true

  # ---- SQL, Reliability (added with the backup-redundancy projection) ----------------------
  # requestedBackupStorageRedundancy; master is a system database with no backup setting [SQL-RE-C]
  - id: WAF-DATA-SQL-19
    title: "WAF-DATA-SQL-19. Database backup storage is geo-redundant or geo-zone-redundant"
    severity: medium
    query: "$.domains.databases.sqlDatabases[?(@.name != 'master' && @.backupRedundancy != 'Geo' && @.backupRedundancy != 'GeoZone')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlDatabases[*]" }
    remediation: "WAF-DATA-SQL-19. The databases listed keep backups on local or zone-redundant storage, or carry no backup redundancy setting. Geo-restore is disabled on them. Use geo-redundant (or geo-zone-redundant) backup storage so a regional outage can be recovered from; where data residency forbids it, record the exception. Hyperscale sets this at creation only."
    manual: false

  # ---- MI, Reliability ---------------------------------------------------------------------
  # properties.zoneRedundant; failover groups are child resources, not collected, so that half is not scored [MI-RE]
  - id: WAF-DATA-MI-01
    title: "WAF-DATA-MI-01. Managed instances are zone redundant"
    severity: high
    query: "$.domains.databases.sqlManagedInstances[?(@.zoneRedundant != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlManagedInstances[*]" }
    remediation: "WAF-DATA-MI-01. The instances listed are not zone redundant. Enable zone redundancy (backup storage must be zone- or geo-zone-redundant first; Next-gen General Purpose has regional limits). Failover groups for regional resilience are child resources that are not collected, so confirm them by hand."
    manual: false
  # requestedBackupStorageRedundancy: Geo and GeoZone pass; Local, Zone and absent do not [MI-RE-R]
  - id: WAF-DATA-MI-02
    title: "WAF-DATA-MI-02. Backup storage is geo-redundant or geo-zone-redundant"
    severity: medium
    query: "$.domains.databases.sqlManagedInstances[?(@.backupRedundancy != 'Geo' && @.backupRedundancy != 'GeoZone')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlManagedInstances[*]" }
    remediation: "WAF-DATA-MI-02. The instances listed keep backups on local or zone-redundant storage, or carry no backup redundancy setting. Use geo-redundant backup storage so geo-restore is available after a regional disaster; where a policy or data residency rule discourages geo-redundant backups, record the exception. Retention against the recovery point objective is not collected."
    manual: false

  # ---- MI, Security ------------------------------------------------------------------------
  # publicDataEndpointEnabled [MI-SE]
  - id: WAF-DATA-MI-03
    title: "WAF-DATA-MI-03. The public data endpoint is off"
    severity: high
    query: "$.domains.databases.sqlManagedInstances[?(@.publicDataEndpointEnabled == true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlManagedInstances[*]" }
    remediation: "WAF-DATA-MI-03. The instances listed expose a public data endpoint. Turn it off; use virtual-network-local connectivity or private endpoints, and NSG rules if public access is unavoidable."
    manual: false
  # private endpoints attached [MI-SE]
  - id: WAF-DATA-MI-04
    title: "WAF-DATA-MI-04. Cross-network access uses private endpoints"
    severity: medium
    query: "$.networking.privateEndpoints[?(@.targetProvider == 'microsoft.sql' && @.targetType == 'managedinstances')]"
    assert: { type: manual }
    remediation: "WAF-DATA-MI-04. Use private endpoints for cross-virtual-network clients. Private endpoints that target managed instances are attached; the instance-to-endpoint pairing is not computed."
    manual: true
  # administrators.azureADOnlyAuthentication: null (no Entra administrator) is SQL authentication only; the identity type is not projected for instances [MI-SE]
  - id: WAF-DATA-MI-05
    title: "WAF-DATA-MI-05. Microsoft Entra-only authentication is used"
    severity: medium
    query: "$.domains.databases.sqlManagedInstances[?(@.entraOnlyAuth != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.sqlManagedInstances[*]" }
    remediation: "WAF-DATA-MI-05. The instances listed still allow SQL authentication, or have no Microsoft Entra administrator (an absent flag is read as not Entra-only). Turn off SQL authentication; the guide also asks for a user-assigned managed identity as the instance identity, which is not collected, so confirm it by hand."
    manual: false
  # customer-managed keys are a requirement-driven choice, so this stays manual; the evidence is the instances NOT on a customer-managed protector (cmkEnabled is not true). The vault's soft delete and purge protection are judged by hand [MI-SE]
  - id: WAF-DATA-MI-06
    title: "WAF-DATA-MI-06. TDE uses a customer-managed key"
    severity: medium
    query: "$.domains.databases.sqlManagedInstances[?(@.cmkEnabled != true)]"
    assert: { type: manual }
    remediation: "WAF-DATA-MI-06. The instances listed use Microsoft-managed (service-managed) TDE protectors; confirm whether policy requires customer-managed keys for them. Where it does, use a customer-managed key held in a dedicated vault with soft delete, purge protection and automated rotation (the vault settings are not read here)."
    manual: true
  # agent, NSG and subnet detail are not collected per instance [MI-SE]
  - id: WAF-DATA-MI-07
    title: "WAF-DATA-MI-07. Defender for SQL is on, SQL Agent is off if unused, and the subnet NSG denies by default"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-MI-07. Enable vulnerability assessment and threat protection, disable unused SQL Agent and apply deny-by-default NSG rules with unique route tables per subnet."
    manual: true
  # type not yet in the diagnostic-settings sweep (proposed in the report) [MI-SE]
  - id: WAF-DATA-MI-08
    title: "WAF-DATA-MI-08. Server and operator auditing go to blob storage and Azure Monitor logs"
    severity: medium
    query: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.sql/managedinstances')]"
    assert: { type: manual }
    remediation: "WAF-DATA-MI-08. Configure dual-destination auditing with immutable storage and a separate operator audit. Managed instances are not in the diagnostic-settings sweep yet."
    manual: true

  # ---- MI, Cost optimization ---------------------------------------------------------------
  # instances attached with sku and vCores [MI-CO]
  - id: WAF-DATA-MI-09
    title: "WAF-DATA-MI-09. vCores and service tier are right-sized, with reservations and Azure Hybrid Benefit"
    severity: low
    query: "$.domains.databases.sqlManagedInstances[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-MI-09. Match vCores to measured need and use reserved capacity and Azure Hybrid Benefit. Instances are attached."
    manual: true

  # ---- MI, Operational excellence ----------------------------------------------------------
  # maintenance configurations attached (estate-wide) [MI-OE]
  - id: WAF-DATA-MI-10
    title: "WAF-DATA-MI-10. Maintenance windows and the update policy are chosen deliberately"
    severity: low
    query: "$.management.maintenanceConfigurations[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-MI-10. Set a maintenance window and the update policy that balances immediate patching against Managed Instance link compatibility. Maintenance configurations are attached."
    manual: true

  # ---- MI, Performance efficiency ----------------------------------------------------------
  # instances attached [MI-PE]
  - id: WAF-DATA-MI-11
    title: "WAF-DATA-MI-11. The service tier, vCores and storage are validated against the workload"
    severity: low
    query: "$.domains.databases.sqlManagedInstances[*]"
    assert: { type: manual }
    remediation: "WAF-DATA-MI-11. Review service tier, read scale-out and tuning features against load tests. Instances are attached."
    manual: true

  # ---- COS, Reliability --------------------------------------------------------------------
  # zoneRedundantRegionCount counts the regions whose isZoneRedundant flag is true; null or 0 means no region is zone redundant [COS-RE-R]
  - id: WAF-DATA-COS-01
    title: "WAF-DATA-COS-01. Cosmos DB accounts are distributed across availability zones"
    severity: high
    query: "$.domains.databases.cosmosDbAccounts[?(@.zoneRedundantRegionCount < 1)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-01. The accounts listed have no zone-redundant region. Enable availability-zone support on each region that offers it so replicas are spread across zones; it is set when a region is added. An account with some zone-redundant regions and some not passes, because a filter cannot compare the region count with the zone-redundant count."
    manual: false
  # regionCount is the length of the locations array; null (absent) counts as fewer than two [COS-RE-R]
  - id: WAF-DATA-COS-02
    title: "WAF-DATA-COS-02. Accounts span at least two regions"
    severity: high
    query: "$.domains.databases.cosmosDbAccounts[?(@.regionCount < 2)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-02. The accounts listed have fewer than two regions. Add a second region so the account survives a regional outage."
    manual: false
  # only multi-region, single-write accounts need service-managed failover; null flags read as not enabled [COS-RE-R]
  - id: WAF-DATA-COS-03
    title: "WAF-DATA-COS-03. Service-managed failover is enabled"
    severity: medium
    query: "$.domains.databases.cosmosDbAccounts[?(@.regionCount > 1 && @.multiRegionWrites != true && @.automaticFailover != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-03. The accounts listed span more than one region with a single write region and do not have service-managed failover. Enable it so a write-region failure fails over without manual action. Single-region and multi-region-write accounts are not flagged."
    manual: false
  # backupPolicy.type is Continuous or Periodic; absent is not continuous [COS-RE-C]
  - id: WAF-DATA-COS-04
    title: "WAF-DATA-COS-04. Continuous backup with point-in-time restore is configured"
    severity: medium
    query: "$.domains.databases.cosmosDbAccounts[?(@.backupType != 'Continuous')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-04. The accounts listed use periodic backup, or carry no backup type. Move them to continuous backup (one way, and not available to every API) and pick the retention that matches the business need."
    manual: false

  # ---- COS, Security -----------------------------------------------------------------------
  # account publicNetworkAccess [COS-SE-R]
  - id: WAF-DATA-COS-05
    title: "WAF-DATA-COS-05. Cosmos DB accounts have public network access disabled"
    severity: high
    query: "$.domains.databases.cosmosDbAccounts[?(@.publicNetworkAccess != 'Disabled' && @.publicNetworkAccess != 'SecuredByPerimeter')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-05. The accounts listed accept public network access. Disable the public endpoint and use private endpoints."
    manual: false
  # account to private endpoint join [COS-SE-R]
  - id: WAF-DATA-COS-06
    title: "WAF-DATA-COS-06. Each Cosmos DB account has a private endpoint"
    severity: medium
    join:
      left: "$.domains.databases.cosmosDbAccounts[*]"
      leftKey: "id"
      right: "$.networking.privateEndpoints[*]"
      rightKey: "targetResourceId"
      mode: "leftOnly"
      leftLabel: "Cosmos DB account"
      rightLabel: "private endpoint"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-06. The accounts listed have no private endpoint. Add one to reduce the attack surface."
    manual: false
  # disableLocalAuth [COS-SE-R]
  - id: WAF-DATA-COS-07
    title: "WAF-DATA-COS-07. Key-based (local) authentication is disabled in favour of Microsoft Entra ID"
    severity: high
    query: "$.domains.databases.cosmosDbAccounts[?(@.disableLocalAuth != true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-07. The accounts listed still accept keys. Move clients to Entra ID and set disableLocalAuth to true (check last-used key metadata first)."
    manual: false
  # accounts that still accept public traffic need a virtual network filter or IP rules; RBAC is not read here [COS-SE-R]
  - id: WAF-DATA-COS-08
    title: "WAF-DATA-COS-08. Accounts that accept public traffic limit it with virtual network rules or IP firewall rules"
    severity: medium
    query: "$.domains.databases.cosmosDbAccounts[?(@.publicNetworkAccess != 'Disabled' && @.publicNetworkAccess != 'SecuredByPerimeter' && @.vnetFilterEnabled != true && @.ipRuleCount < 1)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.databases.cosmosDbAccounts[*]" }
    remediation: "WAF-DATA-COS-08. The accounts listed accept public network access with no virtual network filter and no IP rules, so any address can reach them. Add service-endpoint virtual network rules or IP firewall rules, or disable public access. Role-based access at control and data plane is not read here, so review it by hand."
    manual: false
  # Defender plan row attached; the plan name was not re-verified [COS-SE-R]
  - id: WAF-DATA-COS-09
    title: "WAF-DATA-COS-09. Microsoft Defender for Azure Cosmos DB is enabled"
    severity: medium
    query: "$.security.defenderPlans[?(@.name == 'CosmosDbs')]"
    assert: { type: manual }
    remediation: "WAF-DATA-COS-09. Enable Defender for Azure Cosmos DB for anomaly alerts. The Defender plan row is attached when present."
    manual: true
  # diagnostic-settings coverage for the account type [COS-SE-C, COS-SE-R]
  - id: WAF-DATA-COS-10
    title: "WAF-DATA-COS-10. Cosmos DB accounts send control-plane logs and metrics to Log Analytics"
    severity: medium
    query: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.documentdb/databaseaccounts' && @.coveragePct < 100)]"
    assert: { type: countEquals, value: 0, gate: "$.opsPosture.diagnosticCoverage[?(@.type == 'microsoft.documentdb/databaseaccounts')]" }
