  # ---- BLOB, Security ----------------------------------------------------------------------
  # allowBlobPublicAccess [BLOB-SE-R]
  - id: WAF-DATA-BLOB-01
    title: "WAF-DATA-BLOB-01. Anonymous blob access is disabled on storage accounts"
    severity: high
    query: "$.domains.storage.storageAccounts[?(@.publicAccess == true)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-01. The accounts listed allow anonymous blob access. Disable it so no container can be made public."
    manual: false
  # supportsHttpsTrafficOnly [BLOB-SE-C, BLOB-SE-S]
  - id: WAF-DATA-BLOB-02
    title: "WAF-DATA-BLOB-02. Secure transfer (HTTPS) is required"
    severity: medium
    query: "$.domains.storage.storageAccounts[?(@.httpsOnly == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-02. The accounts listed allow HTTP. Require secure transfer so HTTP requests fail."
    manual: false
  # minimumTlsVersion: an account that never set it is absent here ('' once projected) and allows TLS 1.0, so only TLS1_2 and TLS1_3 pass [BLOB-SE-R]
  - id: WAF-DATA-BLOB-03
    title: "WAF-DATA-BLOB-03. The minimum TLS version is 1.2"
    severity: medium
    query: "$.domains.storage.storageAccounts[?(@.minTls != 'TLS1_2' && @.minTls != 'TLS1_3')]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-03. The accounts listed allow TLS 1.0 or 1.1, or have no minimum TLS version set, which allows TLS 1.0. Set the minimum TLS version to 1.2."
    manual: false
  # networkAcls.defaultAction [BLOB-SE-C, BLOB-SE-R]
  - id: WAF-DATA-BLOB-04
    title: "WAF-DATA-BLOB-04. The storage firewall denies by default"
    severity: medium
    query: "$.domains.storage.storageAccounts[?(@.networkDefaultDeny == false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-04. The accounts listed allow traffic by default. Disable public endpoint traffic or limit access to specific virtual networks and private endpoints."
    manual: false
  # account to private endpoint join (any service) [BLOB-SE-R]
  - id: WAF-DATA-BLOB-05
    title: "WAF-DATA-BLOB-05. Each storage account has a private endpoint for clients that run in Azure"
    severity: medium
    join:
      left: "$.domains.storage.storageAccounts[*]"
      leftKey: "id"
      right: "$.networking.privateEndpoints[*]"
      rightKey: "targetResourceId"
      mode: "leftOnly"
      leftLabel: "storage account"
      rightLabel: "private endpoint"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-05. The accounts listed have no private endpoint. Create one for Azure-hosted clients; enable the public endpoint only for external clients that need it."
    manual: false
  # allowSharedKeyAccess: only an explicit false passes; true and an absent flag (null, which means allowed) are findings [BLOB-SE-R, BLOB-SE-S]
  - id: WAF-DATA-BLOB-06
    title: "WAF-DATA-BLOB-06. Shared Key authorisation is disallowed and access uses Microsoft Entra RBAC"
    severity: medium
    query: "$.domains.storage.storageAccounts[?(@.sharedKeyAccess != false)]"
    assert: { type: countEquals, value: 0, gate: "$.domains.storage.storageAccounts[*]" }
    remediation: "WAF-DATA-BLOB-06. The accounts listed allow Shared Key authorisation, or never set it (an absent flag means allowed). Disallow Shared Key (which also blocks account and service SAS) once clients use Entra ID, and use RBAC or user-delegation SAS with an SAS expiry policy."
    manual: false
  # encryption.keySource is Microsoft.Storage or Microsoft.Keyvault (the key uri is not projected); CMK is requirement-driven, so the item is manual and the evidence is the accounts NOT on a Key Vault key. Defender for Storage is item BLOB-17 [BLOB-SE-C, BLOB-SE-R]
  - id: WAF-DATA-BLOB-07
