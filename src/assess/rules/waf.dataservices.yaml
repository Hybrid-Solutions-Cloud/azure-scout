  # ---- COS, Operational excellence ---------------------------------------------------------
  # practice, not ARM [COS-OE-R]
  - id: WAF-DATA-COS-14
    title: "WAF-DATA-COS-14. Accounts and containers deploy as code and SDKs are current"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "WAF-DATA-COS-14. Deploy with Bicep, ARM or Terraform, keep the SDK at the recommended version and capture client diagnostics."
