area: "Azure billing and Microsoft Entra tenant"
framework: CAF
# AB#6797 design-area weighting -- see docs/design/caf-design-area-weighting.md for the full
# rationale. weight = (this area's verified recommendation count) / (mean count across the 8
# CAF design areas), from docs/audits/AZURE-SCOUT-AUDIT.md §8 Table 2: 42 / 45.625 = 0.92.
weight: 0.92
# guidance version/date this file was last verified against (AB#6799):
verifiedAgainst: "CAF landing zone design area: Azure billing and Microsoft Entra ID tenant, learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/design-area/azure-billing-ad-tenant and azure-billing-microsoft-customer-agreement, verified 2026-08-01"
#
# AB#6798 -- this file previously held cost-optimization rules (orphaned disks/PIPs, Advisor
# cost, budgets, reservations) that duplicated waf.cost.yaml. The design area named "Azure
# billing and Microsoft Entra ID tenant" is about commercial/tenant setup, not cost telemetry:
# EA/MCA/CSP enrollment, invoice-section hierarchy, subscription vending, MFA on identities that
# can create subscriptions, billing RBAC hygiene, and tenant topology. The cost rules moved to
# waf.cost.yaml (WAF-CO-07..09); this file was rewritten from scratch against that design area's
# actual recommendations. See docs/audits/AZURE-SCOUT-AUDIT.md §8 Table 2 "caf.billing.yaml is
# misnamed" for the full source citation.
#
# Every rule here is manual: Scout's collectors read Resource Manager / Resource Graph, not the
# Billing (EA/MCA) or tenant-administration APIs, so none of these can be scored from
# collect.json today without a new collector. Manual-with-a-clear-check beats a false pass.
rules:
  - id: CAF-BIL-01
    title: "Break-glass emergency-access accounts excluded from Conditional Access"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "Confirm at least two break-glass (emergency-access) accounts exist, are excluded from every Conditional Access policy, use strong non-expiring credentials stored offline, and are monitored for sign-in. No Conditional Access or emergency-access-account collector exists yet."
    manual: true

  - id: CAF-BIL-02
    title: "MFA required for every identity that can create subscriptions"
    severity: high
    query: null
    assert: { type: manual }
    remediation: "Confirm every identity holding subscription-creation rights on a billing account, billing profile, or invoice section is enrolled in MFA. No Billing RBAC or EA/MCA administration collector exists yet."
    manual: true

  - id: CAF-BIL-03
    title: "Billing role assignments reviewed on a regular cadence"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "Confirm billing account/profile/invoice-section RBAC role assignments (Billing Administrator, Billing Reader, etc.) are reviewed periodically, not granted once and forgotten."
    manual: true

  - id: CAF-BIL-04
    title: "Billing account notification contact configured"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm a notification-contact email is configured on the billing account so invoice, payment-failure, and spend-threshold notices reach an accountable owner."
    manual: true

  - id: CAF-BIL-05
    title: "Microsoft Entra tenant topology (single vs. multiple tenants) is a deliberate decision"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm the choice of one Microsoft Entra ID tenant versus several (e.g. for M&A, sovereignty, or strict separation) is documented and deliberate, not an accident of how subscriptions were created."
    manual: true

  - id: CAF-BIL-06
    title: "Subscription vending is a repeatable, governed process"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "Confirm new subscriptions are provisioned through a repeatable vending process (self-service or ticketed) that applies the landing-zone baseline automatically, rather than ad hoc portal creation outside management-group governance."
    manual: true
