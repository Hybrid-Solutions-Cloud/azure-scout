area: "Azure billing and Microsoft Entra tenant"
framework: CAF
# AB#6797 design-area weighting -- see docs/design/caf-design-area-weighting.md for the full
# rationale. weight = (this area's verified recommendation count) / (mean count across the 8
# CAF design areas), from docs/audits/AZURE-SCOUT-AUDIT.md §8 Table 2: 42 / 45.625 = 0.92.
weight: 0.92
# guidance version/date this file was last verified against (AB#6799/AB#6817):
frameworkversion: "CAF landing zone design area: Azure billing and Microsoft Entra ID tenant, learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/design-area/azure-billing-ad-tenant and azure-billing-microsoft-customer-agreement, verified 2026-08-01"
#
# AB#6798 -- this file previously held cost-optimization rules (orphaned disks/PIPs, Advisor
# cost, budgets, reservations) that duplicated waf.cost.yaml. The design area named "Azure
# billing and Microsoft Entra ID tenant" is about commercial/tenant setup, not cost telemetry:
# EA/MCA/CSP enrollment, invoice-section hierarchy, subscription vending, MFA on identities that
# can create subscriptions, billing RBAC hygiene, and tenant topology. The cost rules moved to
# waf.cost.yaml (WAF-CO-07..09); this file was rewritten from scratch against that design area's
# actual recommendations. See docs/audits/AZURE-SCOUT-AUDIT.md §8 Table 2 "caf.billing.yaml is
# misnamed" for the full source citation.
#
# Every rule here is manual except CAF-BIL-02: Scout's collectors read Resource Manager / Resource
# Graph, not the Billing (EA/MCA) or tenant-administration APIs, so the others cannot be scored
# from collect.json without a new collector. Manual-with-a-clear-check beats a false pass.
# CAF-BIL-02 is scored from Entra Conditional Access (domains.identity.conditionalAccess), which
# governs sign-in to Azure management and so to subscription creation. CAF-BIL-01 stays manual and
# carries the Conditional Access policies that have exclusions as evidence.
rules:
  - id: CAF-BIL-01
    title: "Break-glass emergency-access accounts excluded from Conditional Access"
    severity: high
    # Evidence only. Scout reads which enabled all-users policies EXCLUDE users or groups, but not
    # who those accounts are, so it cannot tell a break-glass account from any other exclusion,
    # nor whether the accounts exist, hold strong offline credentials or are monitored.
    query: "$.domains.identity.conditionalAccess.policies[?(@.enabled == true && @.targetsAllUsers == true && @.hasExclusions == true)]"
    assert: { type: manual }
    remediation: "Confirm at least two break-glass (emergency-access) accounts exist, are excluded from every Conditional Access policy, use strong non-expiring credentials stored offline, and are monitored for sign-in. The enabled all-users Conditional Access policies that exclude users or groups are listed as evidence (none listed means no such policy or Conditional Access was not read -- domains.identity.conditionalAccess.Reason says which); check each exclusion is the break-glass group and nothing broader."
    manual: true

  - id: CAF-BIL-02
    title: "MFA required for every identity that can create subscriptions"
    severity: high
    # Subscriptions are created through Azure Resource Manager and the Azure portal, so requiring
    # MFA for ALL users on the Windows Azure Service Management API (or all cloud apps) covers every
    # identity that can create one. Either an enabled Conditional Access policy, or Security defaults
    # (which require MFA for Azure management), satisfies it -- hence the union of the two arrays.
    # The Microsoft Admin Portals grouping is deliberately NOT accepted: it protects the portal but
    # not Azure CLI or PowerShell, which create subscriptions too. Exclusions (normally the
    # break-glass accounts) are not subtracted; they are on the evidence row as `hasExclusions`.
    # Gated on `baselineAssessable`, not just `Collected`: reading Security defaults needs a role some
    # readers lack, and with no policy and Security defaults unreadable the tenant may be protected by
    # them -- that reads Not assessed, never Fail.
    query: "$.domains.identity.conditionalAccess['policies','securityDefaultsCoverage'][?(@.enabled == true && @.requiresMfa == true && @.targetsAzureManagement == true && @.targetsAllUsers == true)]"
    assert: { type: exists, gate: "$.domains.identity.conditionalAccess.baselineAssessable" }
    remediation: "No enabled Conditional Access policy (and no Security defaults) requires MFA for all users on Azure management. Create a policy that requires MFA for all users on the Microsoft Azure Management cloud app (or all cloud apps) and turn it On -- a report-only policy does not count, and a policy scoped only to administrator roles or only to the Microsoft Admin Portals leaves other users and Azure CLI/PowerShell unprotected. Billing roles themselves are not collected, so who holds subscription-creation rights is not checked."
    manual: false

  - id: CAF-BIL-03
    title: "Billing role assignments reviewed on a regular cadence"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "Confirm billing account/profile/invoice-section RBAC role assignments (Billing Administrator, Billing Reader, etc.) are reviewed periodically, not granted once and forgotten."
    manual: true

  - id: CAF-BIL-04
    title: "Billing account notification contact configured"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm a notification-contact email is configured on the billing account so invoice, payment-failure, and spend-threshold notices reach an accountable owner."
    manual: true

  - id: CAF-BIL-05
    title: "Microsoft Entra tenant topology (single vs. multiple tenants) is a deliberate decision"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm the choice of one Microsoft Entra ID tenant versus several (e.g. for M&A, sovereignty, or strict separation) is documented and deliberate, not an accident of how subscriptions were created."
    manual: true

  - id: CAF-BIL-06
    title: "Subscription vending is a repeatable, governed process"
    severity: medium
    query: null
    assert: { type: manual }
    remediation: "Confirm new subscriptions are provisioned through a repeatable vending process (self-service or ticketed) that applies the landing-zone baseline automatically, rather than ad hoc portal creation outside management-group governance."
    manual: true
