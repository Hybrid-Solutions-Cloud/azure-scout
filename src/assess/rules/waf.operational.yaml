area: "Operational excellence"
framework: WAF
frameworkversion: "WAF pillar guidance, learn.microsoft.com/azure/well-architected, verified 2026-07-31"
weight: 1.0
verifiedAgainst: "WAF Operational Excellence checklist, learn.microsoft.com/azure/well-architected/operational-excellence/checklist, verified 2026-08-01"
rules:
  - id: WAF-OE-01
    title: "Diagnostic settings coverage above threshold"
    severity: medium
    query: "$.opsPosture.diagnosticCoverage[?(@.coveragePct >= 80)]"
    # Gated: coverage is only known when the diagnostic-settings ARM sweep ran (AB#9300).
    assert: { type: exists, gate: "$.opsPosture.diagnosticCoverageMeasured" }
    remediation: "Enable diagnostic settings to a central workspace for at least 80% of resource types."
    manual: false

  - id: WAF-OE-02
    title: "Infrastructure deployed as code"
    severity: medium
    query: "$.management.deployments[?(@.properties.templateHash)]"
    assert: { type: exists }
    remediation: "Manage infrastructure via IaC pipelines with peer review."
    manual: false

  - id: WAF-OE-05
    title: "Runbooks / operational procedures documented"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm operational runbooks exist for incident response and recovery."
    manual: true

  - id: WAF-OE-06
    title: "Alert rules configured for critical resource health/metrics"
    severity: medium
    # monitor.metricAlertRules is collected (AB#9300): an enabled metric alert rule with at least one
    # action (actionGroupCount = the rule's actions array) is the evidence. A rule with no action
    # group alerts nobody, so it does not count. The check proves alerting exists, not that it covers
    # the critical resources or that the thresholds are right -- the remediation says so.
    query: "$.monitor.metricAlertRules[?(@.enabled == true && @.actionGroupCount > 0)]"
    assert: { type: exists }
    remediation: "No enabled Azure Monitor metric alert rule with an action group was found. Create alert rules for critical resource health and key metrics and route them to an action group. A passing result shows alerting exists, not that it covers the critical resources -- confirm coverage and thresholds."
    manual: false

  - id: WAF-OE-07
    title: "Automation accounts / runbooks reduce manual operational toil"
    severity: low
    query: null
    assert: { type: manual }
    remediation: "Confirm Automation Accounts, runbooks, or Update Management are in place to automate routine operational tasks. No automation-account collector exists yet."
    manual: true

  - id: WAF-OE-08
    title: "Majority of resource groups show IaC-managed deployments"
    severity: medium
    query: "$.management.deployments[?(@.properties.templateHash)]"
    assert: { type: percentageAtLeast, value: 70, denominatorQuery: "$.management.deployments[*]" }
    remediation: "Increase the share of deployments driven by IaC pipelines rather than manual/portal changes; target at least 70%."
    manual: false
